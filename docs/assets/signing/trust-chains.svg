<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Three questions, three proofs</title>
  <desc id="d">Each release answers three questions. Who built this: the Developer ID certificate signs the app with codesign, and Gatekeeper checks the signature. Has Apple checked it: the App Store Connect key lets notarytool get a ticket that is stapled to the DMG, and Gatekeeper checks the ticket. Same publisher: the Sparkle private key signs the update into appcast.xml, and the installed app verifies it with the public key it already holds.</desc>
  <style>
    svg { --bg:#f7f6f2; --panel:#ffffff; --ink:#1b1f22; --muted:#59626a; --line:#d5d8d6; --a:#2f62c9; --b:#a86b00; --c:#1f8a5b; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1012; --panel:#1c2224; --ink:#f3f0e7; --muted:#a8afad; --line:#394044; --a:#8ab7ff; --b:#e7b75f; --c:#5ed49d; }
    }
    .bg { fill: var(--bg); }
    .head { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .box { fill: var(--panel); stroke-width: 1.5; }
    .tt { fill: var(--ink); font-size: 13px; font-weight: 650; text-anchor: middle; }
    .st { fill: var(--muted); font-size: 11.5px; text-anchor: middle; }
    .q { font-size: 13px; font-weight: 700; }
    .note { fill: var(--muted); font-size: 12px; }
    .a .box { stroke: var(--a); } .a .q, .a .ah { fill: var(--a); } .a .ar { stroke: var(--a); } .a .lane { fill: var(--a); }
    .b .box { stroke: var(--b); } .b .q, .b .ah { fill: var(--b); } .b .ar { stroke: var(--b); } .b .lane { fill: var(--b); }
    .c .box { stroke: var(--c); } .c .q, .c .ah { fill: var(--c); } .c .ar { stroke: var(--c); } .c .lane { fill: var(--c); }
    .lane { opacity: .07; }
    .ar { stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z" style="fill:var(--a)"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--b)"/></marker>
    <marker id="hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--c)"/></marker>
  </defs>
  <rect class="bg" width="960" height="470" rx="10"/>

  <text class="head" x="115" y="36" text-anchor="middle">Held by the owner</text>
  <text class="head" x="355" y="36" text-anchor="middle">The release job</text>
  <text class="head" x="600" y="36" text-anchor="middle">What ships</text>
  <text class="head" x="840" y="36" text-anchor="middle">Checked on the user's Mac</text>

  <g class="a">
    <rect class="lane" x="10" y="52" width="940" height="120" rx="10"/>
    <text class="q" x="22" y="72">1 · Who built this?</text>
    <rect class="box" x="20" y="82" width="190" height="80" rx="8"/>
    <text class="tt" x="115" y="108">Developer ID certificate</text>
    <text class="st" x="115" y="128">+ its private key,</text>
    <text class="st" x="115" y="144">exported as a .p12</text>
    <rect class="box" x="250" y="82" width="210" height="80" rx="8"/>
    <text class="tt" x="355" y="108">codesign</text>
    <text class="st" x="355" y="128">hardened runtime, timestamp,</text>
    <text class="st" x="355" y="144">entitlements + profile</text>
    <rect class="box" x="500" y="82" width="200" height="80" rx="8"/>
    <text class="tt" x="600" y="108">Signed app</text>
    <text class="st" x="600" y="128">a seal over every binary</text>
    <text class="st" x="600" y="144">in the bundle</text>
    <rect class="box" x="740" y="82" width="200" height="80" rx="8"/>
    <text class="tt" x="840" y="108">Gatekeeper</text>
    <text class="st" x="840" y="128">signature chains up</text>
    <text class="st" x="840" y="144">to Apple's root</text>
    <path class="ar" d="M212 122H247" marker-end="url(#ha)"/>
    <path class="ar" d="M462 122H497" marker-end="url(#ha)"/>
    <path class="ar" d="M702 122H737" marker-end="url(#ha)"/>
  </g>

  <g class="b">
    <rect class="lane" x="10" y="182" width="940" height="120" rx="10"/>
    <text class="q" x="22" y="202">2 · Has Apple checked it?</text>
    <rect class="box" x="20" y="212" width="190" height="80" rx="8"/>
    <text class="tt" x="115" y="238">App Store Connect key</text>
    <text class="st" x="115" y="258">.p8 file + key ID</text>
    <text class="st" x="115" y="274">+ issuer ID</text>
    <rect class="box" x="250" y="212" width="210" height="80" rx="8"/>
    <text class="tt" x="355" y="238">notarytool, then stapler</text>
    <text class="st" x="355" y="258">Apple scans the DMG and</text>
    <text class="st" x="355" y="274">issues a ticket; it's stapled on</text>
    <rect class="box" x="500" y="212" width="200" height="80" rx="8"/>
    <text class="tt" x="600" y="238">Notarized DMG</text>
    <text class="st" x="600" y="258">the ticket travels</text>
    <text class="st" x="600" y="274">inside the file</text>
    <rect class="box" x="740" y="212" width="200" height="80" rx="8"/>
    <text class="tt" x="840" y="238">Gatekeeper</text>
    <text class="st" x="840" y="258">a ticket exists for</text>
    <text class="st" x="840" y="274">exactly this file</text>
    <path class="ar" d="M212 252H247" marker-end="url(#hb)"/>
    <path class="ar" d="M462 252H497" marker-end="url(#hb)"/>
    <path class="ar" d="M702 252H737" marker-end="url(#hb)"/>
  </g>

  <g class="c">
    <rect class="lane" x="10" y="312" width="940" height="120" rx="10"/>
    <text class="q" x="22" y="332">3 · Is this update from the same publisher?</text>
    <rect class="box" x="20" y="342" width="190" height="80" rx="8"/>
    <text class="tt" x="115" y="368">Sparkle private key</text>
    <text class="st" x="115" y="388">EdDSA, kept in the</text>
    <text class="st" x="115" y="404">login Keychain</text>
    <rect class="box" x="250" y="342" width="210" height="80" rx="8"/>
    <text class="tt" x="355" y="368">sign_update</text>
    <text class="st" x="355" y="388">signs the DMG and writes the</text>
    <text class="st" x="355" y="404">signature into appcast.xml</text>
    <rect class="box" x="500" y="342" width="200" height="80" rx="8"/>
    <text class="tt" x="600" y="368">appcast.xml + DMG</text>
    <text class="st" x="600" y="388">the feed installed</text>
    <text class="st" x="600" y="404">apps poll for updates</text>
    <rect class="box" x="740" y="342" width="200" height="80" rx="8"/>
    <text class="tt" x="840" y="368">The installed app</text>
    <text class="st" x="840" y="388">verifies with the public key</text>
    <text class="st" x="840" y="404">it shipped with</text>
    <path class="ar" d="M212 382H247" marker-end="url(#hc)"/>
    <path class="ar" d="M462 382H497" marker-end="url(#hc)"/>
    <path class="ar" d="M702 382H737" marker-end="url(#hc)"/>
  </g>

  <text class="note" x="20" y="456">Questions 1 and 2 are Apple's and run on every first launch. Question 3 is Sparkle's, runs on every update, and shares no key with Apple.</text>
</svg>
