<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Where each credential lives</title>
  <desc id="d">The owner keeps the originals: certificate, provisioning profile and API key files in ~/.config/apple, the .p12 password in a password manager, the key ID and issuer ID in App Store Connect, and the Sparkle key in the login Keychain. setup-release-secrets.sh uploads them as seven secrets to the release-candidate GitHub environment. Only the build-sign-notarize-release job on main can read them; it loads the certificate into a temporary keychain, signs, notarizes, signs the appcast, and deletes the keychain.</desc>
  <style>
    svg { --bg:#f7f6f2; --panel:#ffffff; --ink:#1b1f22; --muted:#59626a; --line:#c9cdcb; --a:#2f62c9; --b:#a86b00; --c:#1f8a5b; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1012; --panel:#1c2224; --ink:#f3f0e7; --muted:#a8afad; --line:#4a5256; --a:#8ab7ff; --b:#e7b75f; --c:#5ed49d; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .hd { fill: var(--ink); font-size: 14px; font-weight: 700; }
    .hd-sub { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .path { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
    .grp { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .it { fill: var(--ink); font-size: 12px; }
    .mono { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    .st { fill: var(--muted); font-size: 12px; }
    .da { fill: var(--a); } .db { fill: var(--b); } .dc { fill: var(--c); }
    .ar { stroke: var(--muted); stroke-width: 1.8; fill: none; }
    .ah { fill: var(--muted); }
    .al { fill: var(--muted); font-size: 11px; text-anchor: middle; }
    .note { fill: var(--muted); font-size: 12px; }
    .key { font-size: 11.5px; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="960" height="390" rx="10"/>

  <rect class="box" x="20" y="20" width="260" height="290" rx="10"/>
  <text class="hd" x="36" y="46">Owner's Mac</text>
  <text class="hd-sub" x="36" y="64">the originals</text>
  <text class="path" x="36" y="92">~/.config/apple/</text>
  <circle class="da" cx="40" cy="108" r="4"/><text class="mono" x="52" y="112">Developer_ID_Application_&lt;TEAM&gt;.p12</text>
  <circle class="da" cx="40" cy="126" r="4"/><text class="mono" x="52" y="130">workspaces.provisionprofile</text>
  <circle class="db" cx="40" cy="144" r="4"/><text class="mono" x="52" y="148">AuthKey_&lt;KEY_ID&gt;.p8</text>
  <text class="grp" x="36" y="176">Password manager</text>
  <circle class="da" cx="40" cy="192" r="4"/><text class="it" x="52" y="196">.p12 export password</text>
  <text class="grp" x="36" y="224">App Store Connect</text>
  <circle class="db" cx="40" cy="240" r="4"/><text class="it" x="52" y="244">key ID and issuer ID</text>
  <text class="grp" x="36" y="272">Login Keychain</text>
  <circle class="dc" cx="40" cy="288" r="4"/><text class="it" x="52" y="292">Sparkle private key</text>

  <path class="ar" d="M284 165H346" marker-end="url(#h)"/>
  <text class="al" x="315" y="155">upload</text>
  <text class="al" x="315" y="184">once</text>

  <rect class="box" x="350" y="20" width="340" height="290" rx="10"/>
  <text class="hd" x="366" y="46">GitHub environment</text>
  <text class="hd-sub" x="366" y="64">release-candidate · write-only secrets</text>
  <circle class="da" cx="370" cy="100" r="4"/><text class="mono" x="382" y="104">APPLE_DEVELOPER_ID_CERT_BASE64</text>
  <circle class="da" cx="370" cy="128" r="4"/><text class="mono" x="382" y="132">APPLE_DEVELOPER_ID_CERT_PASSWORD</text>
  <circle class="da" cx="370" cy="156" r="4"/><text class="mono" x="382" y="160">APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64</text>
  <circle class="db" cx="370" cy="184" r="4"/><text class="mono" x="382" y="188">APPLE_API_KEY_BASE64</text>
  <circle class="db" cx="370" cy="212" r="4"/><text class="mono" x="382" y="216">APPLE_API_KEY_ID</text>
  <circle class="db" cx="370" cy="240" r="4"/><text class="mono" x="382" y="244">APPLE_API_ISSUER_ID</text>
  <circle class="dc" cx="370" cy="268" r="4"/><text class="mono" x="382" y="272">SPARKLE_PRIVATE_KEY</text>

  <path class="ar" d="M694 165H756" marker-end="url(#h)"/>
  <text class="al" x="725" y="155">read on</text>
  <text class="al" x="725" y="184">main only</text>

  <rect class="box" x="760" y="20" width="180" height="290" rx="10"/>
  <text class="hd" x="776" y="46">Build job</text>
  <text class="hd-sub" x="776" y="64">build-sign-notarize-…</text>
  <text class="st" x="776" y="100">1. temp keychain from</text>
  <text class="st" x="776" y="116">    the .p12 + password</text>
  <text class="st" x="776" y="144">2. sign the app with</text>
  <text class="st" x="776" y="160">    the embedded profile</text>
  <text class="st" x="776" y="188">3. notarize and staple</text>
  <text class="st" x="776" y="204">    with the API key</text>
  <text class="st" x="776" y="232">4. sign the appcast</text>
  <text class="st" x="776" y="248">    with the Sparkle key</text>
  <text class="st" x="776" y="276">5. delete the keychain</text>

  <circle class="da" cx="24" cy="340" r="4"/><text class="note key" x="34" y="344">Apple identity (code signing)</text>
  <circle class="db" cx="224" cy="340" r="4"/><text class="note key" x="234" y="344">Notarization</text>
  <circle class="dc" cx="334" cy="340" r="4"/><text class="note key" x="344" y="344">Sparkle updates</text>
  <text class="note" x="20" y="372">GitHub never shows a secret back. To replace one, upload it again from the owner's copy with scripts/setup-release-secrets.sh.</text>
</svg>
