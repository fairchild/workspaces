<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Landing — Override</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="repo-banner" class="banner"></div>
        <div id="workspace-grid" class="grid"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-icon">⎔</div>
            <p class="empty-title">No workspaces yet</p>
            <p class="empty-subtitle">Create one to start a new coding session</p>
            <button class="btn-primary" onclick="bridge('createWorkspace')">New Workspace</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
