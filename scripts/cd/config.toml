# Preview→Validate→Promote CD bootstrap manifest.
# Consumed by scripts/cd/bootstrap-preview.py.
#
# Adding a new worker to CD: append a [[workers]] block.
# Adding a new preview-secret to an existing worker: append to preview_secrets.
# Adding a new GitHub Actions secret: append to github_secrets.from_env.

[repo]
# Used for `gh secret set --repo`. Must be owner/name.
slug = "fairchild/workspaces"

[vercel]
# Directory containing the Next.js app and the Vercel project link.
# The bootstrap also writes/merges `git.deploymentEnabled = false` into
# <project_dir>/vercel.json so Vercel's git integration stops auto-deploying
# branches and PRs. No dashboard step required.
project_dir = "web"

[[workers]]
dir = "infra/cloudflare-webhook-relay"
preview_health_url = "https://webhooks-preview.cloudcompute.com/health"
preview_secrets = ["GITHUB_WEBHOOK_SECRET", "JWT_SIGNING_SECRET"]
preview_secret_hints.GITHUB_WEBHOOK_SECRET = "Shared HMAC secret configured on your GitHub App's webhook settings. Find it at https://github.com/settings/apps → your app → Webhook → Secret. Copy verbatim; generating a new one requires updating the GitHub App too."
preview_secret_hints.JWT_SIGNING_SECRET = "Random 64+ bytes used to sign session JWTs. Generate once with `openssl rand -base64 64` and reuse; rotating invalidates existing sessions."

[[workers]]
dir = "infra/cloudflare-evidence-store"
preview_health_url = "https://evidence-preview.cloudcompute.com/health"
preview_secrets = ["EVIDENCE_UPLOAD_TOKEN"]
preview_secret_hints.EVIDENCE_UPLOAD_TOKEN = "Bearer token required by clients uploading screenshots/artifacts to the preview evidence Worker. Generate with `openssl rand -hex 32`; must differ from the production token."

[github_secrets]
# Secrets read straight from env and pushed to GitHub Actions.
from_env = [
  "VERCEL_TOKEN",
  "CLOUDFLARE_API_TOKEN",
  "CLOUDFLARE_ACCOUNT_ID",
  "VERCEL_AUTOMATION_BYPASS_SECRET",
]
# Secrets derived from web/.vercel/project.json after `vercel link`.
from_vercel_link = ["VERCEL_ORG_ID", "VERCEL_PROJECT_ID"]
