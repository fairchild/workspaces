name = "webhook-relay"
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[durable_objects.bindings]]
name = "WEBHOOK_RELAY"
class_name = "WebhookRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebhookRelay"]

[[routes]]
pattern = "webhooks.cloudcompute.com"
custom_domain = true

[vars]
WEBHOOK_FORWARD_URL = "https://spaces.cloudcompute.com/api/webhooks/github"

# --- Preview environment ---
[env.preview]
name = "webhook-relay-preview"

[[env.preview.routes]]
pattern = "webhooks-preview.cloudcompute.com"
custom_domain = true

[[env.preview.durable_objects.bindings]]
name = "WEBHOOK_RELAY"
class_name = "WebhookRelay"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["WebhookRelay"]
