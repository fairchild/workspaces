# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files", args = ["--maxkb=500"] },
]

[[repos]]
repo = "local"
hooks = [
    { id = "swift-format", name = "swift-format", entry = "swift-format lint --strict --recursive Sources/ Tests/", language = "system", types = ["swift"], pass_filenames = false },
    { id = "biome-web",    name = "biome-web",    entry = "pnpm --dir web lint",                                    language = "system", files = "^web/.*\\.(ts|tsx|css|json)$", pass_filenames = false },
]
