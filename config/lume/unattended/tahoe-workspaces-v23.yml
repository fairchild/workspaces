# Workspaces override for Lume's Tahoe unattended setup preset.
# v23 keeps the full v11 flow but changes the Screen Time pane to move focus
# with Shift+Tab before activating, in case Tab lands on the wrong control on
# the official installed runtime on this host.

boot_wait: 30

setup_assistant_managed:
  SkipSetupItems:
    - AppleID
    - ScreenTime
    - Siri
  SkipCloudSetup: true
  SkipScreenTime: true
  SkipSiriSetup: true

