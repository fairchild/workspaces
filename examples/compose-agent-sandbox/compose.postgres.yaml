# Adds a development database reachable only on this project's internal network.
# Its throwaway password is local example data, never a production credential.
services:
  agent:
    networks: [default, database]
    environment:
      DATABASE_URL: postgres://sandbox:sandbox@postgres:5432/sandbox
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox
    networks: [database]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

networks:
  database:
    internal: true

volumes:
  postgres-data:
