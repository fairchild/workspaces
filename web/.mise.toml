[tasks."web:check"]
description = "Run typecheck + lint + unit tests."
run = "pnpm typecheck && pnpm lint && pnpm test"

[tasks."web:dev"]
# GitHub-backed features (agent discovery, pipeline, activity feed) need
# a real token. Run as `DEV_GH_TOKEN=$(gh auth token) mise run web:dev`
# to plumb one through; otherwise the UI will prompt "sign out / sign in"
# when it hits the GitHub API. Setting GITHUB_WEB_WORKSPACES_CLIENT_ID
# skips the bypass entirely and uses real OAuth. See AGENTS.md
# § "Web dashboard tasks" and web/src/lib/auth-server.ts.
description = "Seed dev database and start dev server with auth bypass (set DEV_GH_TOKEN for real GitHub data)."
run = "node scripts/dev-seed.js && DEV_BYPASS_AUTH=1 pnpm dev"

[tasks."web:e2e"]
description = "Run Playwright E2E tests (fast + full projects)."
run = "pnpm exec playwright test --project=fast --project=full --reporter=list"

[tasks."web:e2e:demo"]
description = "Run Playwright demo tests with video recording."
run = "pnpm exec playwright test --project=demo --reporter=list"

[tasks."web:evidence"]
description = "Capture Playwright screenshots and upload to evidence store."
usage = "--pr <number> [--name <slug>]"
run = """
#!/usr/bin/env bash
set -euo pipefail

PR="${1:?usage: mise run web:evidence -- --pr <N> [--name <slug>]}"
# Strip --pr flag if present
[[ "$PR" == "--pr" ]] && PR="${2:?missing PR number}" && shift
NAME="${3:-terminal-tab}"
[[ "$NAME" == "--name" ]] && NAME="${4:-terminal-tab}"

TMPDIR=$(mktemp -d)
trap "rm -rf $TMPDIR" EXIT

# Capture screenshots via Playwright
node -e "
const { chromium } = require('@playwright/test');
(async () => {
  const browser = await chromium.launch();
  const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
  await page.goto('http://localhost:3000/dashboard/fairchild/workspaces?tab=terminal');
  await page.waitForLoadState('networkidle');
  await page.waitForTimeout(1500);
  await page.screenshot({ path: '$TMPDIR/terminal.png' });
  await page.goto('http://localhost:3000/dashboard/fairchild/workspaces');
  await page.waitForLoadState('networkidle');
  await page.waitForTimeout(1000);
  await page.screenshot({ path: '$TMPDIR/dashboard.png' });
  await browser.close();
  console.log('Screenshots captured');
})();
"

# Upload
cd "$(git rev-parse --show-toplevel)"
./scripts/evidence.sh --pr "$PR" --name "${NAME}-terminal" --file "$TMPDIR/terminal.png"
./scripts/evidence.sh --pr "$PR" --name "${NAME}-dashboard" --file "$TMPDIR/dashboard.png"
"""

[tasks."web:deps"]
description = "Add pnpm packages and auto-fix package.json formatting."
usage = "<packages...>"
run = """
#!/usr/bin/env bash
set -euo pipefail
pnpm add "$@"
pnpm biome check --write package.json 2>/dev/null || true
echo "Installed and formatted."
"""

[tasks."web:deps:remove"]
description = "Remove pnpm packages and auto-fix package.json formatting."
usage = "<packages...>"
run = """
#!/usr/bin/env bash
set -euo pipefail
pnpm remove "$@"
pnpm biome check --write package.json 2>/dev/null || true
echo "Removed and formatted."
"""

[tasks."web:e2e:explore"]
description = "Run the qa-explore Playwright project (video + trace + axe-core)."
run = "pnpm exec playwright test --project=qa-explore --reporter=list"

[tasks."web:e2e:deployment-smoke"]
description = "Run deployment-safe Playwright smoke locally."
run = """
#!/usr/bin/env bash
set -euo pipefail
PORT="${PORT:-3212}"
PORT="$PORT" \
PLAYWRIGHT_BASE_URL="http://127.0.0.1:$PORT" \
PLAYWRIGHT_SKIP_DB_FIXTURES=1 \
pnpm exec playwright test --project=deployment-smoke --workers=1 --reporter=list
"""

[tasks."web:preview:auth"]
description = "Create or refresh a real-OAuth Playwright storage state for a Vercel preview."
run = "node scripts/preview-auth.mjs"

[tasks."web:preview:smoke"]
description = "Run deployment-safe Playwright smoke against a Vercel preview."
run = """
#!/usr/bin/env bash
set -euo pipefail

URL=""
while [[ $# -gt 0 ]]; do
  case "$1" in
    --pr)
      shift
      URL="https://pr-${1:?missing PR number}.spaces-preview.cloudcompute.com"
      ;;
    --url)
      shift
      URL="${1:?missing preview URL}"
      ;;
    *)
      echo "usage: mise run web:preview:smoke -- --pr <number> | --url <url>" >&2
      exit 2
      ;;
  esac
  shift
done

if [[ -z "$URL" ]]; then
  echo "usage: mise run web:preview:smoke -- --pr <number> | --url <url>" >&2
  exit 2
fi

PLAYWRIGHT_BASE_URL="$URL" \
PLAYWRIGHT_SKIP_WEB_SERVER=1 \
PLAYWRIGHT_SKIP_DB_FIXTURES=1 \
pnpm exec playwright test --project=deployment-smoke --reporter=list
"""

[tasks."web:preview:explore"]
description = "Run exploratory Playwright QA against an authenticated Vercel preview."
run = """
#!/usr/bin/env bash
set -euo pipefail

URL=""
while [[ $# -gt 0 ]]; do
  case "$1" in
    --pr)
      shift
      URL="https://pr-${1:?missing PR number}.spaces-preview.cloudcompute.com"
      ;;
    --url)
      shift
      URL="${1:?missing preview URL}"
      ;;
    *)
      echo "usage: mise run web:preview:explore -- --pr <number> | --url <url>" >&2
      exit 2
      ;;
  esac
  shift
done

if [[ -z "$URL" ]]; then
  echo "usage: mise run web:preview:explore -- --pr <number> | --url <url>" >&2
  exit 2
fi

HOST="$(node -e 'console.log(new URL(process.argv[1]).host.replace(/[^A-Za-z0-9_.-]/g, "_"))' "$URL")"
STATE=".auth/preview-${HOST}.json"
if [[ ! -f "$STATE" ]]; then
  echo "missing $STATE; run: mise run web:preview:auth -- --url $URL" >&2
  exit 2
fi

mkdir -p "output/preview-qa/$HOST"
PLAYWRIGHT_BASE_URL="$URL" \
PLAYWRIGHT_SKIP_WEB_SERVER=1 \
PLAYWRIGHT_SKIP_DB_FIXTURES=1 \
PLAYWRIGHT_STORAGE_STATE="$STATE" \
PLAYWRIGHT_OUTPUT_DIR="output/preview-qa/$HOST/test-results" \
pnpm exec playwright test --project=qa-explore --reporter=list
"""

[tasks."web:qa:init-agents"]
description = "One-shot: scaffold Playwright's agent-loop instructions (for Claude Code) into the repo. Run once; commit the output."
run = "pnpm exec playwright init-agents --loop=claude"

[tasks."web:qa:codegen"]
description = "Launch Playwright codegen against the dev server to record interactions into a starter .spec.ts."
usage = "[url]"
run = """
#!/usr/bin/env bash
set -euo pipefail
URL="${1:-${PLAYWRIGHT_BASE_URL:-http://localhost:3000}}"
pnpm exec playwright codegen --target=javascript "$URL"
"""
