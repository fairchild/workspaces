name: CI — Agent Scripts

on:
  push:
    branches: [main]
    paths:
      - ".agents/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/tests/**"
      - "scripts/agent-triage-request.py"
      - "scripts/check-subprocess-timeouts.py"
      - "scripts/runners.py"
      - "config/github/repo-variables.json"
      - "scripts/factory-implement.py"
      - "scripts/factory-janitor.py"
      - "scripts/factory-review.py"
      - "scripts/factory-evidence-verify.py"
      - "scripts/factory-responder-payload.py"
      - "scripts/factory-worker-token.py"
      - "scripts/factory-worker-identity.sh"
      - "fixtures/factory-janitor/**"
      - "scripts/fable-orchestrator.py"
      - "scripts/close-v1-discussions.py"
      - "fixtures/close-v1-discussions/**"
      - ".github/workflows/cd-fail-notify.js"
      - ".github/workflows/cd-fail-notify.test.js"
  pull_request:
    branches: [main]
    paths:
      - ".agents/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/tests/**"
      - "scripts/agent-triage-request.py"
      - "scripts/check-subprocess-timeouts.py"
      - "scripts/runners.py"
      - "config/github/repo-variables.json"
      - "scripts/factory-implement.py"
      - "scripts/factory-janitor.py"
      - "scripts/factory-review.py"
      - "scripts/factory-evidence-verify.py"
      - "scripts/factory-responder-payload.py"
      - "scripts/factory-worker-token.py"
      - "scripts/factory-worker-identity.sh"
      - "fixtures/factory-janitor/**"
      - "scripts/fable-orchestrator.py"
      - "scripts/close-v1-discussions.py"
      - "fixtures/close-v1-discussions/**"
      - ".github/workflows/cd-fail-notify.js"
      - ".github/workflows/cd-fail-notify.test.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Net-new: nothing checked Actions schema before. The nearest thing,
  # scripts/validate-release-changes.py, runs `YAML.load_file` on release.yml —
  # that proves the file is YAML, not that it is a workflow GitHub will accept,
  # so the check the PR readiness gate takes as evidence for workflow changes
  # cannot see a misspelled key, a bad `needs:`, an undefined matrix reference,
  # or an unknown runner label. This job can. It reads .github/actionlint.yaml,
  # so a workflow reaching for a decommissioned self-hosted lane fails here.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Pinned binary verified by checksum rather than a third-party action,
      # matching how mise-security.yml provisions its pinned tool.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      # shellcheck at --severity=warning: actionlint shells out to it for every
      # `run:` block, and real shell bugs should fail. Style opinions should not
      # — plain actionlint is red on main today over two SC2129 "consider using
      # { cmd; } >> file" notes in release.yml, and a gate that starts red
      # teaches people to ignore it. `shellcheck --version` runs first so the
      # job fails loudly if the image ever stops shipping it, rather than
      # quietly linting less than it claims to.
      - name: Lint workflows
        run: |
          set -euo pipefail
          shellcheck --version
          actionlint -shellcheck "shellcheck --severity=warning"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Run frontmatter parser tests
        run: uv run .agents/scripts/test_parse_frontmatter.py

      - name: Run planner tests
        run: uv run .agents/scripts/test_run_planner.py

      - name: Run gh-discuss tests
        run: uv run .agents/skills/gh-discuss/scripts/test_gh_discuss.py

      # Recurses scripts/tests/ instead of hand-enumerating scripts here so
      # "add a test, forget the run step" can't leave a script gating nothing.
      # find (not a glob) so a future nested scripts/tests/**/test_*.py — which
      # the paths filter above already covers — isn't silently skipped.
      - name: Run scripts/tests/*.py
        run: |
          failed=()
          while IFS= read -r -d '' test_file; do
            echo "::group::${test_file}"
            if ! uv run --script "$test_file"; then
              failed+=("$test_file")
            fi
            echo "::endgroup::"
          done < <(find scripts/tests -type f -name '*.py' -print0 | sort -z)
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed: ${failed[*]}" >&2
            exit 1
          fi

      - name: Run CD failure notifier tests
        run: node --test .github/workflows/cd-fail-notify.test.js
