name: Evidence Reminder

on:
  pull_request:
    types: [opened, edited, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: evidence-reminder-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-evidence:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for evidence in PR body
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').toLowerCase();
            const hasEvidenceUrl = body.includes('evidence.cloudcompute.com');
            const hasScreenshot = /!\[.*\]\(http/.test(body);
            const hasTestOutput = /test.*pass|tests.*pass|\d+ passed/i.test(body);
            const isDocsOnly = /not a testable change/i.test(body) &&
              body.includes('[x] not a testable change');
            const hasEvidence = hasEvidenceUrl || hasScreenshot || hasTestOutput || isDocsOnly;

            if (hasEvidence) {
              core.info('Evidence found in PR body');
              return;
            }

            // Check PR comments for evidence
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 30,
            });
            const commentEvidence = comments.data.some(c => {
              const cb = (c.body || '').toLowerCase();
              return cb.includes('evidence.cloudcompute.com') ||
                     /!\[.*\]\(http/.test(cb) ||
                     /test.*pass|tests.*pass|\d+ passed/i.test(cb);
            });

            if (commentEvidence) {
              core.info('Evidence found in PR comments');
              return;
            }

            // Post a gentle reminder
            const marker = '<!-- evidence-reminder -->';
            const existing = comments.data.find(c => (c.body || '').includes(marker));
            if (existing) {
              core.info('Reminder already posted');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                marker,
                '**Evidence reminder** — this PR doesn\'t appear to have test results or screenshots attached yet.',
                '',
                'Quick options:',
                '```bash',
                '# Capture + upload in one step',
                `./scripts/evidence.sh --pr ${context.payload.pull_request.number} --name <slug>`,
                '',
                '# Or via mise',
                `mise run evidence -- --pr ${context.payload.pull_request.number} --name <slug>`,
                '```',
                '',
                'If this is a docs-only change, check `Not a testable change` in the PR template.',
              ].join('\n'),
            });
