# Fetches Xcode Cloud build logs for a commit via the App Store Connect API.
# GitHub check-runs only carry Xcode Cloud's one-line failure summary; the full
# script stdout/stderr lives in ASC LOG_BUNDLE artifacts, and the ASC API
# credentials exist only as repo secrets — so the fetch runs inside Actions.
name: Xcode Cloud Logs

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA whose Xcode Cloud build logs to fetch
        required: true
  push:
    branches:
      - ci/xcode-cloud-logs

permissions:
  contents: read

concurrency:
  group: xcode-cloud-logs-${{ inputs.sha || github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    # The App Store Connect key this reads is Admin-scoped, so it lives on an
    # environment rather than at repository scope, where any workflow on any
    # branch could read it. The environment's branch policy allows only `main`
    # and `ci/xcode-cloud-logs` — matching this workflow's triggers — so
    # declaring the environment is not by itself enough to reach the key.
    environment: xcode-cloud-logs
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Fetch logs
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          TARGET_SHA: ${{ inputs.sha || '9b57a02a714fdb218b3db6cb8fc673510c84081b' }}
        run: uv run --script scripts/fetch-xcode-cloud-logs.py --sha "$TARGET_SHA" --out "$RUNNER_TEMP/xcode-cloud-logs"

      - name: Upload log bundles
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: xcode-cloud-logs
          path: ${{ runner.temp }}/xcode-cloud-logs
          retention-days: 5
          if-no-files-found: ignore

      # This is deliberately inert until both environment-scoped values exist.
      # The configured endpoint receives a raw-log-free manifest only; it must
      # use GitHub's Actions API to verify this workflow path, workflow_dispatch
      # event, main head branch, and completed successful run before confirming
      # an incident. A running workflow cannot truthfully confirm its own final
      # conclusion, so that verification belongs to the trusted collector. No
      # observation means diagnosis is unknown and requires agent triage; it is
      # not an empty callback the collector might mistake for confirmation.
      - name: Optionally hand off trusted diagnosis
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && vars.OPS_DIAGNOSTIC_URL != '' }}
        env:
          OPS_DIAGNOSTIC_URL: ${{ vars.OPS_DIAGNOSTIC_URL }}
          OPS_DIAGNOSTIC_TOKEN: ${{ secrets.OPS_DIAGNOSTIC_TOKEN }}
          DIAGNOSTIC_REPORT: ${{ runner.temp }}/xcode-cloud-logs/diagnostic-handoff.json
        run: |
          set -euo pipefail
          test -n "${OPS_DIAGNOSTIC_TOKEN:-}" || exit 0
          test -s "$DIAGNOSTIC_REPORT"
          if test "$(jq '.observations | length' "$DIAGNOSTIC_REPORT")" -eq 0; then
            echo "note: diagnosis unknown; no callback sent and agent triage is required" >&2
            exit 0
          fi
          validated_url="$(uv run --script scripts/fetch-xcode-cloud-logs.py --validate-callback-url "$OPS_DIAGNOSTIC_URL")"
          set +x
          case "$OPS_DIAGNOSTIC_TOKEN" in
            *[!A-Za-z0-9_-]*) echo "error: OPS_DIAGNOSTIC_TOKEN has an unsupported format" >&2; exit 1 ;;
          esac
          if test "${#OPS_DIAGNOSTIC_TOKEN}" -lt 32; then
            echo "error: OPS_DIAGNOSTIC_TOKEN must contain at least 32 URL-safe characters" >&2
            exit 1
          fi
          echo "::add-mask::$OPS_DIAGNOSTIC_TOKEN"
          auth_config="$(mktemp)"
          chmod 600 "$auth_config"
          trap 'rm -f "$auth_config"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$OPS_DIAGNOSTIC_TOKEN" > "$auth_config"
          curl --config "$auth_config" --fail --silent --show-error --connect-timeout 5 --max-time 15 --request POST \
            --header "Content-Type: application/json" \
            --data-binary "@$DIAGNOSTIC_REPORT" \
            "$validated_url" >/dev/null
