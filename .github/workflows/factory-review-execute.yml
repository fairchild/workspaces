# Executes counterpart review only from trusted default-branch workflow code.
# Every artifact and current PR field is revalidated before reviewer secrets load.

name: Factory Review Executor

on:
  workflow_run:
    workflows: [Factory Review]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  admit:
    # Owner `workflow_dispatch` still bypasses the kill switches (long-standing,
    # documented in docs/development/factory-current-state.md). The Evidence
    # Verify lane's re-review request does not: it is automation, so it runs
    # only while automation is switched on.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      ((github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.actor.login == github.repository_owner) ||
      (vars.AGENT_AUTOMATIONS_ENABLED == 'true' &&
      vars.FACTORY_REVIEW_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      force_review: ${{ steps.context.outputs.force_review }}
      refresh_stale: ${{ steps.context.outputs.refresh_stale }}
      body_edit: ${{ steps.context.outputs.body_edit }}
      matched: ${{ steps.admit.outputs.matched }}
      pr_number: ${{ steps.admit.outputs.pr_number }}
      reviewer: ${{ steps.admit.outputs.reviewer }}
      head_sha: ${{ steps.admit.outputs.head_sha }}
      linked_issue: ${{ steps.admit.outputs.linked_issue }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Download untrusted review context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-review-context
          path: context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve trusted review context
        id: context
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(jq -er '.pr_number | select(type == "number")' context/factory-review-context.json)"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          # Two dispatch actors, with different authority. The owner asks for
          # an unconditional re-review. The Actions identity is the Evidence
          # Verify lane asking the review lane to look again after it cleared
          # the last blocking evidence entry (#1379) -- that request is only
          # ever a request: --refresh-stale-review lets factory-review.py
          # re-derive, from live PR state, whether a standing rejection is
          # actually refreshable. Any other dispatcher is refused.
          FORCE_REVIEW=false
          REFRESH_STALE=false
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            if [ "$RUN_ACTOR" = "$REPOSITORY_OWNER" ]; then
              FORCE_REVIEW=true
            elif [ "$RUN_ACTOR" = "github-actions[bot]" ]; then
              REFRESH_STALE=true
            else
              echo "Only the repository owner or the factory may re-request review." >&2
              exit 1
            fi
          fi
          # A body edit answering a standing rejection (#1509). The signal lane
          # that set this flag runs the pull request's own workflow file, so it
          # is a third request rather than a fact -- and the narrowest of the
          # three: --body-edit-review both permits the already-reviewed bypass
          # and requires it, so a body edit with nothing standing to answer
          # reviews nothing. Only a pull_request run may ask; a dispatch has
          # its own two authorities above.
          BODY_EDIT=false
          if [ "$RUN_EVENT" = "pull_request" ]; then
            BODY_EDIT="$(jq -r '.body_edited == true' context/factory-review-context.json)"
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "force_review=$FORCE_REVIEW"
            echo "refresh_stale=$REFRESH_STALE"
            echo "body_edit=$BODY_EDIT"
          } >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Enforce review daily cap and runaway guard
        working-directory: source
        env:
          FACTORY_REVIEW_DAILY_CAP: ${{ vars.FACTORY_REVIEW_DAILY_CAP || '12' }}
          FACTORY_REVIEW_RUNAWAY_CAP: ${{ vars.FACTORY_REVIEW_RUNAWAY_CAP || '' }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --script scripts/factory-review.py --authorize
      - name: Admit counterpart review
        id: admit
        working-directory: source
        env:
          BODY_EDIT: ${{ steps.context.outputs.body_edit }}
          FORCE_REVIEW: ${{ steps.context.outputs.force_review }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REFRESH_STALE: ${{ steps.context.outputs.refresh_stale }}
        run: |
          set -euo pipefail
          ARGS=(--pr "$PR_NUMBER")
          if [ "$FORCE_REVIEW" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "$REFRESH_STALE" = "true" ]; then
            ARGS+=(--refresh-stale-review)
          fi
          if [ "$BODY_EDIT" = "true" ]; then
            ARGS+=(--body-edit-review)
          fi
          uv run --script scripts/factory-review.py "${ARGS[@]}"

  april:
    needs: admit
    if: needs.admit.outputs.matched == 'true' && needs.admit.outputs.reviewer == 'april'
    runs-on: ubuntu-latest
    # 45, not 30: run-contributor.py retries a review once on a transient
    # failure (#1179). Each retryable attempt is capped at 15 minutes
    # (REVIEW_RETRY_ATTEMPT_TIMEOUT_SECONDS, tighter than the CLI's own
    # 20-minute default specifically so two attempts fit safely) -- 30
    # minutes only ever budgeted for one attempt at the untightened ceiling.
    timeout-minutes: 45
    concurrency:
      group: factory-review-april-${{ needs.admit.outputs.pr_number }}-${{ needs.admit.outputs.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Generate April app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ secrets.APRIL_APP_ID }}
          private-key: ${{ secrets.APRIL_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
          path: source
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Revalidate serialized April review
        id: preflight
        working-directory: source
        env:
          BODY_EDIT: ${{ needs.admit.outputs.body_edit }}
          FORCE_REVIEW: ${{ needs.admit.outputs.force_review }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_STALE: ${{ needs.admit.outputs.refresh_stale }}
        run: |
          ARGS=(--pr "${{ needs.admit.outputs.pr_number }}")
          ARGS+=(--expected-head "${{ needs.admit.outputs.head_sha }}")
          ARGS+=(--expected-reviewer april)
          if [ "$FORCE_REVIEW" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "$REFRESH_STALE" = "true" ]; then
            ARGS+=(--refresh-stale-review)
          fi
          if [ "$BODY_EDIT" = "true" ]; then
            ARGS+=(--body-edit-review)
          fi
          uv run --script scripts/factory-review.py "${ARGS[@]}"
      - name: Checkout admitted pull request head
        if: steps.preflight.outputs.matched == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 1
          path: model-workspace
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Remove PR-controlled execution configuration
        if: steps.preflight.outputs.matched == 'true'
        run: |
          find model-workspace -type l -delete
          rm -f model-workspace/.npmrc
      - name: Run April counterpart review
        if: steps.preflight.outputs.matched == 'true'
        working-directory: source
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONTRIBUTOR_MODEL_CWD: ${{ github.workspace }}/model-workspace
          FACTORY_EXPECTED_LINKED_ISSUE: ${{ needs.admit.outputs.linked_issue }}
          FACTORY_EXPECTED_PR_HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
          FACTORY_TELEMETRY_DIR: ${{ runner.temp }}/factory-telemetry
          FACTORY_TELEMETRY_LANE: review
          FACTORY_TELEMETRY_REVIEWER: april
          GH_APP_SLUG: april-clearwater
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.admit.outputs.pr_number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          MESSAGE="@${REPOSITORY_OWNER} mentioned you in PR #${PR_NUMBER}"
          uv run .agents/skills/cofounder-contributor/scripts/run-contributor.py \
            --prompt-file .agents/skills/cofounder-contributor/references/april-clearwater.md \
            --mode cli \
            --message "$MESSAGE"
      - name: Upload April review telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-review-telemetry-april
          path: ${{ runner.temp }}/factory-telemetry
          if-no-files-found: ignore
          retention-days: 1

  plat:
    needs: admit
    if: needs.admit.outputs.matched == 'true' && needs.admit.outputs.reviewer == 'plat'
    runs-on: ubuntu-latest
    # 45, not 30: run-contributor.py retries a review once on a transient
    # failure (#1179). Each retryable attempt is capped at 15 minutes
    # (REVIEW_RETRY_ATTEMPT_TIMEOUT_SECONDS, tighter than the CLI's own
    # 20-minute default specifically so two attempts fit safely) -- 30
    # minutes only ever budgeted for one attempt at the untightened ceiling.
    timeout-minutes: 45
    concurrency:
      group: factory-review-plat-${{ needs.admit.outputs.pr_number }}-${{ needs.admit.outputs.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Generate Plat app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ secrets.WORKSPACE_AGENTS_APP_ID }}
          private-key: ${{ secrets.WORKSPACE_AGENTS_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
          path: source
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Revalidate serialized Plat review
        id: preflight
        working-directory: source
        env:
          BODY_EDIT: ${{ needs.admit.outputs.body_edit }}
          FORCE_REVIEW: ${{ needs.admit.outputs.force_review }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_STALE: ${{ needs.admit.outputs.refresh_stale }}
        run: |
          ARGS=(--pr "${{ needs.admit.outputs.pr_number }}")
          ARGS+=(--expected-head "${{ needs.admit.outputs.head_sha }}")
          ARGS+=(--expected-reviewer plat)
          if [ "$FORCE_REVIEW" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "$REFRESH_STALE" = "true" ]; then
            ARGS+=(--refresh-stale-review)
          fi
          if [ "$BODY_EDIT" = "true" ]; then
            ARGS+=(--body-edit-review)
          fi
          uv run --script scripts/factory-review.py "${ARGS[@]}"
      - name: Checkout admitted pull request head
        if: steps.preflight.outputs.matched == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.admit.outputs.head_sha }}
          fetch-depth: 1
          path: model-workspace
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Remove PR-controlled execution configuration
        if: steps.preflight.outputs.matched == 'true'
        run: |
          find model-workspace -type l -delete
          rm -f model-workspace/.npmrc
      - name: Run Plat counterpart review
        if: steps.preflight.outputs.matched == 'true'
        working-directory: source
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONTRIBUTOR_MODEL_CWD: ${{ github.workspace }}/model-workspace
          FACTORY_EXPECTED_LINKED_ISSUE: ${{ needs.admit.outputs.linked_issue }}
          FACTORY_EXPECTED_PR_HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
          FACTORY_TELEMETRY_DIR: ${{ runner.temp }}/factory-telemetry
          FACTORY_TELEMETRY_LANE: review
          FACTORY_TELEMETRY_REVIEWER: plat
          GH_APP_SLUG: workspace-agents
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.admit.outputs.pr_number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          MESSAGE="@${REPOSITORY_OWNER} mentioned you in PR #${PR_NUMBER}"
          uv run .agents/skills/cofounder-contributor/scripts/run-contributor.py \
            --prompt-file .agents/skills/cofounder-contributor/references/plat-ironwood.md \
            --mode cli \
            --message "$MESSAGE"
      - name: Upload Plat review telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-review-telemetry-plat
          path: ${{ runner.temp }}/factory-telemetry
          if-no-files-found: ignore
          retention-days: 1

  telemetry:
    needs: [admit, april, plat]
    # Runs when either reviewer ran (success or failure); skipped-both means no
    # artifact can exist, so don't spin up a write-capable runner for nothing.
    if: always() && !(needs.april.result == 'skipped' && needs.plat.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The reviewer jobs stay read-only; only this job may write factory/ops-data.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Download review telemetry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: factory-review-telemetry-*
          path: telemetry
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Append cost telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROWS="$GITHUB_WORKSPACE/telemetry/cost-rows.jsonl"
          if [ ! -f "$ROWS" ]; then
            echo "No telemetry cost rows found; nothing to append."
            exit 0
          fi
          uv run --script scripts/factory-cost-append.py --rows "$ROWS"
