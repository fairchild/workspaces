name: "Agent: April Clearwater"

on:
  schedule:
    - cron: '0 14 * * 1,3,5'   # Mon/Wed/Fri first (7:00am PT)
    - cron: '30 14 * * 2,4'    # Tue/Thu second (7:30am PT)
    - cron: '0 16,20,0 * * 0,6' # Weekends every other hour (9am/1pm/5pm PT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print output without posting'
        type: boolean
        default: false
      message:
        description: 'Directed task (overrides normal priority order)'
        type: string
        default: ''

permissions:
  contents: write
  discussions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-april
  cancel-in-progress: false

jobs:
  check-runner:
    # Lightweight probe: is the Lume macOS runner online?
    # Uses the app token because the default GITHUB_TOKEN may lack
    # permission to list self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      is_macos: ${{ steps.pick.outputs.is_macos }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APRIL_APP_ID }}
          private-key: ${{ secrets.APRIL_PRIVATE_KEY }}
      - name: Check lume-macos runner availability
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATUS=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '.runners[] | select(.labels[].name == "lume-macos") | .status' 2>/dev/null || echo "unknown")
          if [ "$STATUS" = "online" ]; then
            echo "runner=[\"self-hosted\", \"lume-macos\"]" >> "$GITHUB_OUTPUT"
            echo "is_macos=true" >> "$GITHUB_OUTPUT"
            echo "Lume runner is online — using [self-hosted, lume-macos]"
          else
            echo "runner=\"ubuntu-latest\"" >> "$GITHUB_OUTPUT"
            echo "is_macos=false" >> "$GITHUB_OUTPUT"
            echo "Lume runner is offline ($STATUS) — falling back to ubuntu-latest"
          fi

  run:
    needs: check-runner
    runs-on: ${{ fromJSON(needs.check-runner.outputs.runner) }}
    timeout-minutes: 30
    outputs:
      needs_macos_evidence: ${{ steps.contributor.outputs.needs_macos_evidence }}
      needs_screenshot_evidence: ${{ steps.contributor.outputs.needs_screenshot_evidence }}
      pr_branch: ${{ steps.contributor.outputs.pr_branch }}
      test_commands_json: ${{ steps.contributor.outputs.test_commands_json }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APRIL_APP_ID }}
          private-key: ${{ secrets.APRIL_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v7
      - name: Sync execution state
        run: uv run .agents/skills/cofounder-contributor/scripts/sync-execution-state.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Run contributor
        id: contributor
        run: |
          ARGS=(--prompt-file .agents/skills/cofounder-contributor/references/april-clearwater.md)
          ARGS+=(--mode cli)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$AGENT_MESSAGE" ]; then
            ARGS+=(--message "$AGENT_MESSAGE")
          fi
          uv run .agents/skills/cofounder-contributor/scripts/run-contributor.py "${ARGS[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          AGENT_MESSAGE: ${{ inputs.message }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: april-clearwater

  # Evidence fallback: only runs when the main job ran on ubuntu (Lume was
  # offline) but somehow came back online before this job starts.  In practice
  # this is rare — if Lume was offline for `run`, it's likely still offline.
  # The job will simply stay queued until the runner appears or the workflow
  # times out, which is acceptable.
  evidence:
    needs: [check-runner, run]
    if: needs.check-runner.outputs.is_macos == 'false' && needs.run.outputs.needs_macos_evidence == 'true'
    runs-on: [self-hosted, lume-macos]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.run.outputs.pr_branch }}
          fetch-depth: 50
      - name: Build GhosttyKit
        id: ghosttykit
        continue-on-error: true
        run: ./scripts/build-ghosttykit.sh
      - name: Build app
        id: build
        continue-on-error: true
        run: swift build
      - name: Run requested tests
        id: tests
        if: needs.run.outputs.test_commands_json != '[]'
        continue-on-error: true
        shell: bash
        env:
          TEST_COMMANDS_JSON: ${{ needs.run.outputs.test_commands_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > .ci-test-commands.txt
          import json
          import os

          for command in json.loads(os.environ["TEST_COMMANDS_JSON"]):
              print(command)
          PY

          : > test-output.txt
          while IFS= read -r command; do
            echo "$ $command" | tee -a test-output.txt
            bash -lc "set -o pipefail; $command 2>&1 | tee -a test-output.txt"
          done < .ci-test-commands.txt
      - name: Capture evidence
        id: smoke
        if: needs.run.outputs.needs_screenshot_evidence == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./scripts/dev-smoke.sh --no-build 2>&1 | tee dev-smoke-output.txt
      - name: Reconcile pending-ci evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ needs.run.outputs.pr_branch }}
          BUILD_SUCCEEDED: ${{ steps.ghosttykit.outcome == 'success' && steps.build.outcome == 'success' }}
          TESTS_SUCCEEDED: ${{ needs.run.outputs.test_commands_json == '[]' || steps.tests.outcome == 'success' }}
          SMOKE_SUCCEEDED: ${{ needs.run.outputs.needs_screenshot_evidence != 'true' || steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --json number --jq '.[0].number')
          gh pr view "$PR_NUMBER" --json body --jq '.body' > pr-body.md
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          module_path = Path(".agents/skills/cofounder-contributor/scripts/run-contributor.py")
          spec = importlib.util.spec_from_file_location("run_contributor", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          body_path = Path("pr-body.md")
          reconciled = module.reconcile_pending_ci_evidence(
              body_path.read_text(),
              build_succeeded=os.environ["BUILD_SUCCEEDED"] == "true",
              tests_succeeded=os.environ["TESTS_SUCCEEDED"] == "true",
              smoke_succeeded=os.environ["SMOKE_SUCCEEDED"] == "true",
          )
          body_path.write_text(reconciled)
          PY
          gh pr edit "$PR_NUMBER" --body-file pr-body.md
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            output/
            test-output.txt
            dev-smoke-output.txt
      - name: Fail on evidence errors
        if: always()
        shell: bash
        env:
          GHOSTTYKIT_OUTCOME: ${{ steps.ghosttykit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TEST_COMMANDS_JSON: ${{ needs.run.outputs.test_commands_json }}
          NEEDS_SCREENSHOT_EVIDENCE: ${{ needs.run.outputs.needs_screenshot_evidence }}
        run: |
          set -euo pipefail
          if [ "$GHOSTTYKIT_OUTCOME" != "success" ] || [ "$BUILD_OUTCOME" != "success" ]; then
            echo "Build evidence failed"
            exit 1
          fi
          if [ "$TEST_COMMANDS_JSON" != "[]" ] && [ "$TESTS_OUTCOME" != "success" ]; then
            echo "Requested test evidence failed"
            exit 1
          fi
          if [ "$NEEDS_SCREENSHOT_EVIDENCE" = "true" ] && [ "$SMOKE_OUTCOME" != "success" ]; then
            echo "Screenshot evidence failed"
            exit 1
          fi
