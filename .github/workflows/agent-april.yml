name: "Agent: April Clearwater"

on:
  schedule:
    - cron: '0 14 * * 1,3,5'   # Mon/Wed/Fri first (7:00am PT)
    - cron: '30 14 * * 2,4'    # Tue/Thu second (7:30am PT)
    - cron: '0 16,20,0 * * 0,6' # Weekends every other hour (9am/1pm/5pm PT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print output without posting'
        type: boolean
        default: false
      message:
        description: 'Directed task (overrides normal priority order)'
        type: string
        default: ''

permissions:
  contents: write
  discussions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-april
  cancel-in-progress: false

jobs:
  run:
    # Contributor automation is CLI-only; keep it on the broadly available hosted lane.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      needs_macos_evidence: ${{ steps.contributor.outputs.needs_macos_evidence }}
      pr_branch: ${{ steps.contributor.outputs.pr_branch }}
      test_filter: ${{ steps.contributor.outputs.test_filter }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APRIL_APP_ID }}
          private-key: ${{ secrets.APRIL_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v7
      - name: Sync execution state
        run: uv run .agents/skills/cofounder-contributor/scripts/sync-execution-state.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Run contributor
        id: contributor
        run: |
          ARGS=(--prompt-file .agents/skills/cofounder-contributor/references/april-clearwater.md)
          ARGS+=(--mode cli)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$AGENT_MESSAGE" ]; then
            ARGS+=(--message "$AGENT_MESSAGE")
          fi
          uv run .agents/skills/cofounder-contributor/scripts/run-contributor.py "${ARGS[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          AGENT_MESSAGE: ${{ inputs.message }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: april-clearwater

  evidence:
    needs: run
    if: needs.run.outputs.needs_macos_evidence == 'true'
    runs-on: [self-hosted, tart-ui]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.run.outputs.pr_branch }}
          fetch-depth: 50
      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh
      - name: Build app
        run: swift build
      - name: Run targeted tests
        if: needs.run.outputs.test_filter != ''
        run: swift test --filter '${{ needs.run.outputs.test_filter }}' 2>&1 | tee test-output.txt || true
      - name: Run all tests (no filter specified)
        if: needs.run.outputs.test_filter == ''
        run: swift test 2>&1 | tee test-output.txt || true
      - name: Capture evidence
        run: ./scripts/dev-smoke.sh --no-build 2>&1 | head -100 || true
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            output/
            test-output.txt
