name: "Agent: April Clearwater"

on:
  schedule:
    - cron: '0 14 * * 1,3,5'   # Mon/Wed/Fri first (7:00am PT)
    - cron: '30 14 * * 2,4'    # Tue/Thu second (7:30am PT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print output without posting'
        type: boolean
        default: false

permissions:
  contents: read
  discussions: write
  issues: read
  pull-requests: write

concurrency:
  group: agent-april
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: astral-sh/setup-uv@v7
      - name: Run contributor
        run: |
          ARGS=(--prompt-file .agents/prompts/april-clearwater.md)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          uv run .agents/scripts/run-contributor.py "${ARGS[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
