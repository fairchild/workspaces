name: CD

# Every push to main goes through preview → validate → promote. Manual
# dispatches (Actions tab / `gh workflow run cd.yml --ref main`) run the same
# pipeline on demand. See scripts/cd/README.md for the mental model and
# bootstrap walkthrough.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  canary-secret-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require managed reviewer canary secret
        env:
          WORKSPACES_WEBHOOK_CANARY_SECRET: ${{ secrets.WORKSPACES_WEBHOOK_CANARY_SECRET }}
        run: |
          if [ -z "$WORKSPACES_WEBHOOK_CANARY_SECRET" ]; then
            echo "::error::WORKSPACES_WEBHOOK_CANARY_SECRET is required before production promotion"
            exit 1
          fi

  managed-reviewer-canary-preflight:
    needs: canary-secret-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Managed reviewer ingress canary before promotion
        env:
          WORKSPACES_WEBHOOK_CANARY_SECRET: ${{ secrets.WORKSPACES_WEBHOOK_CANARY_SECRET }}
        run: |
          set +e
          python3 scripts/managed-reviewer-ingress-canary.py > managed-reviewer-ingress-canary.log 2>&1
          CANARY_EXIT=$?
          cat managed-reviewer-ingress-canary.log
          if [ "$CANARY_EXIT" -ne 0 ]; then
            {
              echo "# Managed reviewer ingress preflight failed"
              echo
              echo '```text'
              cat managed-reviewer-ingress-canary.log
              echo '```'
            } > findings.md
          fi
          exit "$CANARY_EXIT"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-prod-managed-reviewer-ingress-findings
          path: findings.md

  preview-web:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    # Vercel CLI commands run from the repo root so the spaces-web project's
    # rootDirectory=web setting resolves correctly. Only pnpm needs to cd into
    # web/ (for package.json resolution).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Pull Vercel prod env + config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@51 pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@51 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact to preview URL
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # --prod: deploy target must match `vercel build --prod` (CLI v51 enforces this).
        # --skip-domain: don't auto-alias the prod domain; let the `promote` job do that
        # after validators pass — preserves the "validated artifact ships" invariant.
        run: |
          URL=$(npx vercel@51 deploy --prebuilt --prod --skip-domain --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview deployed to $URL"

  preview-workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: cloudflare-webhook-relay
            health_url: https://webhooks-preview.cloudcompute.com/health
          - worker: cloudflare-evidence-store
            health_url: https://evidence-preview.cloudcompute.com/health
    defaults:
      run:
        working-directory: infra/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test evidence worker
        if: matrix.worker == 'cloudflare-evidence-store'
        run: npm ci && npm test
      - name: Deploy to preview env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --env preview
      - name: Smoke /health
        run: |
          for attempt in 1 2 3; do
            if curl -sSf --max-time 10 "${{ matrix.health_url }}"; then
              echo "::notice::Health OK (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed after 3 attempts against ${{ matrix.health_url }}"
          exit 1

  bypass-preflight:
    # Fail fast and loud when Vercel deployment-protection bypass is not honored.
    # A stale/mismatched VERCEL_AUTOMATION_BYPASS_SECRET otherwise lets the
    # validators measure Vercel's SSO login page instead of the app — surfacing
    # as a bogus ~12-minute Lighthouse "perf regression" rather than the real
    # cause. This probes the app root with the bypass header and requires a 2xx;
    # an SSO redirect is a hard fail with the exact remedy. lighthouse and
    # playwright-validate gate on it so the expensive work never runs blind.
    needs: preview-web
    runs-on: ubuntu-latest
    steps:
      - name: Probe preview with protection-bypass header
        env:
          PREVIEW_URL: ${{ needs.preview-web.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set — validators would measure the Vercel SSO login page, not the app. Set the repo secret to the project's Protection-Bypass-for-Automation value (Vercel → spaces-web → Settings → Deployment Protection)."
            exit 1
          fi
          # Capture curl's exit explicitly: `curl -w` emits no trailing newline,
          # so `read` would return non-zero at EOF and, under `set -e`, abort the
          # job before the case ever runs (a false failure on every probe). A
          # herestring re-adds the newline; the network-failure branch is its own.
          set +e
          PROBE=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$PREVIEW_URL/")
          CURL_EXIT=$?
          set -e
          read -r STATUS REDIRECT <<< "$PROBE"
          echo "preview probe: status=${STATUS:-<none>} redirect=${REDIRECT:-<none>} curl_exit=$CURL_EXIT"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed (exit $CURL_EXIT) probing $PREVIEW_URL/ — could not reach the preview deployment."
            exit 1
          fi
          case "$STATUS" in
            2*)
              echo "Protection-bypass honored — validators will see the app."
              ;;
            *)
              if printf '%s' "$REDIRECT" | grep -qiE '^https://[^/]*vercel\.com/(sso-api|login)([/?#]|$)'; then
                echo "::error::Deployment-protection bypass NOT honored: $PREVIEW_URL/ redirected to Vercel SSO ($REDIRECT). The repo secret VERCEL_AUTOMATION_BYPASS_SECRET does not match the project's Protection-Bypass-for-Automation secret, or that feature is disabled. Fix: Vercel → spaces-web → Settings → Deployment Protection → enable + copy the automation bypass secret, then 'gh secret set VERCEL_AUTOMATION_BYPASS_SECRET --repo fairchild/workspaces'."
              else
                echo "::error::Unexpected status $STATUS probing $PREVIEW_URL/ with the bypass header (redirect=${REDIRECT:-<none>}); expected 2xx."
              fi
              exit 1
              ;;
          esac

  playwright-validate:
    needs: [preview-web, bypass-preflight]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: pnpm exec playwright install chromium --with-deps
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run Playwright deployment smoke against preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview-web.outputs.preview_url }}
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_SKIP_DB_FIXTURES: "1"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +e
          pnpm exec playwright test --project deployment-smoke --reporter=json > playwright-report.json
          PW_EXIT=$?
          node scripts/playwright-findings.js playwright-report.json > findings.md || echo "_findings script failed_" > findings.md
          exit $PW_EXIT
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-findings
          path: web/findings.md

  lighthouse:
    needs: [preview-web, bypass-preflight]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Warmup preview + run LHCI
        env:
          LHCI_COLLECT_URL: ${{ needs.preview-web.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          BYPASS_CURL=()
          BYPASS_LHCI=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_CURL=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
            HEADERS_JSON=$(printf '{"x-vercel-protection-bypass":"%s","x-vercel-set-bypass-cookie":"true"}' "$VERCEL_AUTOMATION_BYPASS_SECRET")
            BYPASS_LHCI=(--collect.settings.extraHeaders="$HEADERS_JSON")
          fi
          curl -sSf "${BYPASS_CURL[@]}" "$LHCI_COLLECT_URL/" >/dev/null || true
          curl -sSf "${BYPASS_CURL[@]}" "$LHCI_COLLECT_URL/" >/dev/null || true
          set +e
          pnpm exec lhci autorun --config=./lighthouserc.json --collect.url="$LHCI_COLLECT_URL" "${BYPASS_LHCI[@]}"
          LHCI_EXIT=$?
          node scripts/lhci-findings.js .lighthouseci/assertion-results.json > findings.md || echo "_findings script failed_" > findings.md
          exit $LHCI_EXIT
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-findings
          path: web/findings.md

  promote:
    needs:
      - preview-web
      - preview-workers
      - playwright-validate
      - lighthouse
      - canary-secret-preflight
      - managed-reviewer-canary-preflight
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Deploy workers to prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for w in cloudflare-webhook-relay cloudflare-evidence-store; do
            echo "::group::wrangler deploy $w"
            (cd "infra/$w" && npx wrangler@4 deploy)
            echo "::endgroup::"
          done
      - name: Promote validated Vercel preview to prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@51 promote "${{ needs.preview-web.outputs.preview_url }}" \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          echo "::notice::Promoted ${{ needs.preview-web.outputs.preview_url }} to production"

  fail-notify-playwright:
    needs: [preview-web, playwright-validate]
    if: failure() && !cancelled() && needs.playwright-validate.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      # Checkout is required so the github-script step can import the shared
      # fail-notify logic at .github/workflows/cd-fail-notify.js.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-findings
          path: .
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          VALIDATOR: playwright
          PREVIEW_URL: ${{ needs.preview-web.outputs.preview_url }}
          REPRO_HINT: cd web && PLAYWRIGHT_BASE_URL=${{ needs.preview-web.outputs.preview_url }} PLAYWRIGHT_SKIP_WEB_SERVER=1 PLAYWRIGHT_SKIP_DB_FIXTURES=1 pnpm exec playwright test --project deployment-smoke
        with:
          script: |
            // github-script runs from its own dist dir; relative imports look
            // there, not at the workspace. Resolve via GITHUB_WORKSPACE + file URL.
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const abs = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/cd-fail-notify.js');
            const { default: failNotify } = await import(pathToFileURL(abs).href);
            await failNotify({ github, context, core });

  fail-notify-lighthouse:
    needs: [preview-web, lighthouse]
    if: failure() && !cancelled() && needs.lighthouse.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lighthouse-findings
          path: .
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          VALIDATOR: lighthouse
          PREVIEW_URL: ${{ needs.preview-web.outputs.preview_url }}
          REPRO_HINT: cd web && pnpm exec lhci autorun --config=./lighthouserc.json --collect.url=${{ needs.preview-web.outputs.preview_url }}
        with:
          script: |
            // github-script runs from its own dist dir; relative imports look
            // there, not at the workspace. Resolve via GITHUB_WORKSPACE + file URL.
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const abs = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/cd-fail-notify.js');
            const { default: failNotify } = await import(pathToFileURL(abs).href);
            await failNotify({ github, context, core });

  close-on-green-playwright:
    needs: [playwright-validate]
    if: success()
    runs-on: ubuntu-latest
    steps:
      # Checkout is required so the github-script step can import the shared
      # fail-notify logic at .github/workflows/cd-fail-notify.js.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          VALIDATOR: playwright
        with:
          script: |
            // github-script runs from its own dist dir; relative imports look
            // there, not at the workspace. Resolve via GITHUB_WORKSPACE + file URL.
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const abs = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/cd-fail-notify.js');
            const { closeOnGreen } = await import(pathToFileURL(abs).href);
            await closeOnGreen({ github, context, core });

  close-on-green-lighthouse:
    needs: [lighthouse]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          VALIDATOR: lighthouse
        with:
          script: |
            // github-script runs from its own dist dir; relative imports look
            // there, not at the workspace. Resolve via GITHUB_WORKSPACE + file URL.
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const abs = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/cd-fail-notify.js');
            const { closeOnGreen } = await import(pathToFileURL(abs).href);
            await closeOnGreen({ github, context, core });

  validate-prod:
    needs: promote
    if: success()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: pnpm exec playwright install chromium --with-deps
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Settle CDN cache
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSf --max-time 10 "https://spaces.cloudcompute.com/" >/dev/null; then
              echo "::notice::Prod reachable on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Prod unreachable after 5 attempts"
          exit 1
      - name: Managed reviewer ingress canary
        env:
          WORKSPACES_WEBHOOK_CANARY_SECRET: ${{ secrets.WORKSPACES_WEBHOOK_CANARY_SECRET }}
        run: |
          set +e
          python3 ../scripts/managed-reviewer-ingress-canary.py > managed-reviewer-ingress-canary.log 2>&1
          CANARY_EXIT=$?
          cat managed-reviewer-ingress-canary.log
          if [ "$CANARY_EXIT" -ne 0 ]; then
            {
              echo "# Managed reviewer ingress canary failed"
              echo
              echo '```text'
              cat managed-reviewer-ingress-canary.log
              echo '```'
            } > findings.md
          fi
          exit "$CANARY_EXIT"
      - name: Playwright deployment smoke against prod
        env:
          PLAYWRIGHT_BASE_URL: https://spaces.cloudcompute.com
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_SKIP_DB_FIXTURES: "1"
        run: |
          set +e
          pnpm exec playwright test --project deployment-smoke --reporter=json > prod-report.json
          PW_EXIT=$?
          node scripts/playwright-findings.js prod-report.json > findings.md || echo "_findings script failed_" > findings.md
          exit $PW_EXIT
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-validate-findings
          path: web/findings.md

  post-prod-alert:
    needs: [promote, validate-prod]
    if: failure() && !cancelled() && needs.validate-prod.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prod-validate-findings
          path: .
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PROD_URL: https://spaces.cloudcompute.com
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const abs = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/cd-prod-alert.js');
            const { postProdAlert } = await import(pathToFileURL(abs).href);
            await postProdAlert({ github, context, core });

  resolve-prod-alert:
    needs: [promote, validate-prod]
    if: success() && needs.validate-prod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const abs = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/cd-prod-alert.js');
            const { closeResolvedProdAlerts } = await import(pathToFileURL(abs).href);
            await closeResolvedProdAlerts({ github, context, core });
