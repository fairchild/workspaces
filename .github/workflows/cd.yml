name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preview-web:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel prod env + config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@37 pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@37 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact to preview URL
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          URL=$(npx vercel@37 deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview deployed to $URL"

  preview-workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: cloudflare-webhook-relay
            health_url: https://webhooks-preview.cloudcompute.com/health
          - worker: cloudflare-evidence-store
            health_url: https://evidence-preview.cloudcompute.com/health
    defaults:
      run:
        working-directory: infra/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to preview env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --env preview
      - name: Smoke /health
        run: |
          for attempt in 1 2 3; do
            if curl -sSf --max-time 10 "${{ matrix.health_url }}"; then
              echo "::notice::Health OK (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed after 3 attempts against ${{ matrix.health_url }}"
          exit 1

  playwright-validate:
    needs: preview-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Run Playwright fast against preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview-web.outputs.preview_url }}
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
        run: |
          set +e
          pnpm exec playwright test --project fast --reporter=json > playwright-report.json
          PW_EXIT=$?
          node scripts/playwright-findings.mjs playwright-report.json > findings.md || echo "_findings script failed_" > findings.md
          exit $PW_EXIT
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-findings
          path: web/findings.md

  lighthouse:
    needs: preview-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Warmup preview + run LHCI
        env:
          LHCI_COLLECT_URL: ${{ needs.preview-web.outputs.preview_url }}
        run: |
          curl -sSf "$LHCI_COLLECT_URL/" >/dev/null || true
          curl -sSf "$LHCI_COLLECT_URL/" >/dev/null || true
          set +e
          pnpm exec lhci autorun --config=./lighthouserc.cjs
          LHCI_EXIT=$?
          node scripts/lhci-findings.mjs .lighthouseci/assertion-results.json > findings.md || echo "_findings script failed_" > findings.md
          exit $LHCI_EXIT
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-findings
          path: web/findings.md

  promote:
    needs: [preview-web, preview-workers, playwright-validate, lighthouse]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy workers to prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for w in cloudflare-webhook-relay cloudflare-evidence-store; do
            echo "::group::wrangler deploy $w"
            (cd "infra/$w" && npx wrangler@4 deploy)
            echo "::endgroup::"
          done
      - name: Promote validated Vercel preview to prod
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx vercel@37 promote "${{ needs.preview-web.outputs.preview_url }}" \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          echo "::notice::Promoted ${{ needs.preview-web.outputs.preview_url }} to production"

  fail-notify-playwright:
    needs: [preview-web, playwright-validate]
    if: failure() && !cancelled() && needs.playwright-validate.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-findings
          path: .
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          VALIDATOR: playwright
          PREVIEW_URL: ${{ needs.preview-web.outputs.preview_url }}
        with:
          script: |
            const fs = require('fs');
            const validator = process.env.VALIDATOR;
            const marker = `<!-- cd-failure:${validator} -->`;
            const findings = fs.existsSync('findings.md')
              ? fs.readFileSync('findings.md', 'utf8')
              : '_No findings file produced._';

            const title = `CD: ${validator} failures on main`;
            const body = [
              marker,
              `**Commit:** ${context.sha}`,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Preview URL:** ${process.env.PREVIEW_URL || '(not available)'}`,
              '',
              '## Findings',
              findings,
              '',
              '## Plan to fix (if root cause is obvious)',
              '- [ ] Root cause: <one sentence>',
              '- [ ] Reproduction: <local command>',
              '- [ ] Fix approach: <one paragraph>',
              '- [ ] Validation: <how we know it is fixed>',
              '',
              '## Plan to explore (if fix is not obvious)',
              '- [ ] Hypothesis: <one sentence>',
              '- [ ] Experiment: <what to run>',
              '- [ ] Decision point: <what result tells us to do what>',
            ].join('\n');

            const q = `repo:${context.repo.owner}/${context.repo.repo} in:body "${marker}" is:issue`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            const existing = found.data.items[0];

            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated rolling issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cd-failure', `cd-failure:${validator}`, 'auto-opened'],
              });
              core.notice(`Created rolling issue #${created.data.number}`);
            }

  fail-notify-lighthouse:
    needs: [preview-web, lighthouse]
    if: failure() && !cancelled() && needs.lighthouse.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-findings
          path: .
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          VALIDATOR: lighthouse
          PREVIEW_URL: ${{ needs.preview-web.outputs.preview_url }}
        with:
          script: |
            const fs = require('fs');
            const validator = process.env.VALIDATOR;
            const marker = `<!-- cd-failure:${validator} -->`;
            const findings = fs.existsSync('findings.md')
              ? fs.readFileSync('findings.md', 'utf8')
              : '_No findings file produced._';

            const title = `CD: ${validator} failures on main`;
            const body = [
              marker,
              `**Commit:** ${context.sha}`,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Preview URL:** ${process.env.PREVIEW_URL || '(not available)'}`,
              '',
              '## Findings',
              findings,
              '',
              '## Plan to fix (if root cause is obvious)',
              '- [ ] Root cause: <one sentence>',
              '- [ ] Reproduction: <local command>',
              '- [ ] Fix approach: <one paragraph>',
              '- [ ] Validation: <how we know it is fixed>',
              '',
              '## Plan to explore (if fix is not obvious)',
              '- [ ] Hypothesis: <one sentence>',
              '- [ ] Experiment: <what to run>',
              '- [ ] Decision point: <what result tells us to do what>',
            ].join('\n');

            const q = `repo:${context.repo.owner}/${context.repo.repo} in:body "${marker}" is:issue`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            const existing = found.data.items[0];

            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated rolling issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cd-failure', `cd-failure:${validator}`, 'auto-opened'],
              });
              core.notice(`Created rolling issue #${created.data.number}`);
            }
