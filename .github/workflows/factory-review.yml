# Emits a secret-free signal when an agent-authored pull request needs review.
# The default-branch-controlled Factory Review Executor owns privileged execution.

name: Factory Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Agent-authored pull request to review"
        required: true
        type: number

permissions:
  contents: read

jobs:
  # `signal` is the only job, and that is load-bearing for `edited`: when its
  # `if:` is false the whole run concludes `skipped`, not `success`, so the
  # executor's `conclusion == 'success'` admission never fires -- no reviewer
  # token, no artifact download, no step run at all. The executor is still
  # handed a `workflow_run` record for the filtered run, which is why
  # count_daily_run_attempts stopped counting skipped runs: otherwise ordinary
  # title edits would walk the runaway ceiling. An `edited` event that changed
  # only the title or the base branch is filtered here, and so is a draft -- a
  # draft with a standing rejection is skipped by evaluate_review whatever its
  # body now says.
  #
  # Bot-authored edits are deliberately NOT filtered here. Factory Revise
  # answers a body-only objection under April's app token -- an app token,
  # unlike GITHUB_TOKEN, does raise events -- and then dispatches Factory
  # Review itself, so its revisions arrive twice; but the evidence lane
  # (`_evidence.yml`) reconciles `[pending-ci]` entries under the same kind of
  # token and dispatches nothing, and that edit is precisely the objection
  # #1509 exists to re-fire. Telling those two apart by author is not
  # possible. `--expected-standing-review` settles it downstream instead: both
  # admissions bind to the review they answer, and whichever gets there second
  # finds that verdict already superseded.
  signal:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (vars.AGENT_AUTOMATIONS_ENABLED == 'true' &&
      vars.FACTORY_REVIEW_ENABLED == 'true')) &&
      (github.event.action != 'edited' ||
      (github.event.changes.body != null &&
      github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # BODY_EDITED is a request, not a fact: this workflow file is the pull
      # request's own copy. The executor honours it only for a pull_request
      # run and re-derives the standing rejection from live state, so the worst
      # a forged flag can ask for is a re-review the script then declines.
      - name: Write untrusted review context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BODY_EDITED: ${{ github.event.action == 'edited' }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BODY_EDITED" =~ ^(true|false)$ ]]
          printf '{"pr_number":%s,"body_edited":%s}\n' "$PR_NUMBER" "$BODY_EDITED" \
            > "$RUNNER_TEMP/factory-review-context.json"
      - name: Upload review context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-review-context
          path: ${{ runner.temp }}/factory-review-context.json
          retention-days: 1
