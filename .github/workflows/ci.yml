name: CI

on:
  push:
    branches: [main]
    paths:
      # Keep expensive hosted macOS CI focused on product, build, and release inputs.
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-fallback.yml"
      - ".github/workflows/release.yml"
      - ".swift-format"
      - "WorkSpacesCloudCI.xcodeproj/**"
      - "Package.swift"
      - "Package.resolved"
      - "WorkspaceManager.entitlements"
      - "ci_scripts/**"
      - "XcodeCloudHarness/**"
      - "Sources/**"
      - "Tests/**"
      - "scripts/build-ghosttykit.sh"
      - "scripts/build-release.sh"
      - "scripts/check-release-harness-absence.sh"
      - "scripts/generate-sparkle-appcast.sh"
      - "scripts/install-local.sh"
      - "scripts/notarize.sh"
      - "scripts/prepare-prerelease.sh"
      - "scripts/prepare-release.sh"
      - "scripts/release-preflight.sh"
      - "scripts/release-version.sh"
      - "scripts/setup-release-secrets.sh"
      - "scripts/verify-app-keychain-signing.sh"
      - "scripts/verify-installed-perf.sh"
      - "scripts/verify-p12.sh"
      - "scripts/verify-release-bundle.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-fallback.yml"
      - ".github/workflows/release.yml"
      - ".swift-format"
      - "WorkSpacesCloudCI.xcodeproj/**"
      - "Package.swift"
      - "Package.resolved"
      - "WorkspaceManager.entitlements"
      - "ci_scripts/**"
      - "XcodeCloudHarness/**"
      - "Sources/**"
      - "Tests/**"
      - "scripts/build-ghosttykit.sh"
      - "scripts/build-release.sh"
      - "scripts/check-release-harness-absence.sh"
      - "scripts/generate-sparkle-appcast.sh"
      - "scripts/install-local.sh"
      - "scripts/notarize.sh"
      - "scripts/prepare-prerelease.sh"
      - "scripts/prepare-release.sh"
      - "scripts/release-preflight.sh"
      - "scripts/release-version.sh"
      - "scripts/setup-release-secrets.sh"
      - "scripts/verify-app-keychain-signing.sh"
      - "scripts/verify-installed-perf.sh"
      - "scripts/verify-p12.sh"
      - "scripts/verify-release-bundle.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Ensure mise
        run: |
          if command -v mise >/dev/null 2>&1; then
            mise --version
          else
            brew install mise
          fi

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Ensure swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format --version
          else
            brew install swift-format
          fi

      - name: Lint
        run: swift-format lint --strict --recursive Sources/ Tests/

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Check release harness absence
        run: ./scripts/check-release-harness-absence.sh

      - name: Test
        run: swift test
