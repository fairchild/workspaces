name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Generic build/lint/test runs on GitHub-hosted macOS so routine CI never
    # depends on the interactive desktop or the dedicated self-hosted lanes.
    runs-on: macos-17
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Ensure mise
        run: |
          if command -v mise >/dev/null 2>&1; then
            mise --version
          else
            brew install mise
          fi

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Ensure swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format --version
          else
            brew install swift-format
          fi

      - name: Lint
        run: swift-format lint --strict --recursive Sources/ Tests/

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
