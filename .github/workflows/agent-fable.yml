name: "Agent: Fable Orchestrator"

on:
  schedule:
    - cron: "0 15 * * *"   # Daily at 8:00am PT, after the contributors wake
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the recommendation without posting"
        type: boolean
        default: false

permissions:
  contents: read
  discussions: write
  issues: read
  pull-requests: read

concurrency:
  group: agent-fable
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.AGENT_AUTOMATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Preview recommendation
        run: uv run ./scripts/fable-orchestrator.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post daily recommendation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: uv run ./scripts/fable-orchestrator.py --post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
