name: Web Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "web/**"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Vercel preview
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Validate Vercel secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel prod env + config
        # The generated PR URL is still a protected preview deployment, but
        # auth-backed routes need the same runtime secrets as production. The
        # Vercel preview env is intentionally sparse today and produces a
        # Better Auth default-secret 500 on /api/auth/sign-in/social.
        run: npx vercel@51 pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Build preview artifact
        run: npx vercel@51 build --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Deploy prebuilt preview
        id: deploy
        run: |
          URL=$(npx vercel@51 deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview deployed to $URL"

      - name: Comment preview URL
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- spaces-web-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            const headSha = process.env.HEAD_SHA;
            const shortSha = headSha.slice(0, 7);
            const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const body = [
              marker,
              '### Vercel Preview: `spaces-web`',
              '',
              `- Preview: ${previewUrl}`,
              `- Commit: \`${shortSha}\``,
              `- Workflow: [run ${process.env.GITHUB_RUN_NUMBER}](${workflowUrl})`,
              '',
              'This preview is generated by GitHub Actions only when the PR touches `web/**`.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
