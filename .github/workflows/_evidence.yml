name: "Evidence: Build, Test, and Reconcile"

# Reusable workflow for macOS evidence gathering.
# Called by agent-april, agent-plat, and agent-mention workflows when
# the contributor job ran on ubuntu but the work requires macOS evidence.

on:
  workflow_call:
    inputs:
      pr_branch:
        required: true
        type: string
      test_commands_json:
        required: true
        type: string
        default: '[]'
      needs_screenshot_evidence:
        required: false
        type: boolean
        default: false
      upload_screenshots:
        required: false
        type: boolean
        default: false
        description: "Upload screenshots to R2 (April-style). When false, only runs smoke test."
      artifact_name:
        required: false
        type: string
        default: evidence
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true
      EVIDENCE_UPLOAD_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  gather:
    runs-on: [self-hosted, lume-macos]
    timeout-minutes: 20
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr_branch }}
          fetch-depth: 50

      - uses: astral-sh/setup-uv@v7

      - name: Build GhosttyKit
        id: ghosttykit
        continue-on-error: true
        run: ./scripts/build-ghosttykit.sh

      - name: Build app
        id: build
        if: steps.ghosttykit.outcome == 'success'
        continue-on-error: true
        run: swift build

      - name: Run requested tests
        id: tests
        if: steps.build.outcome == 'success' && inputs.test_commands_json != '[]'
        continue-on-error: true
        env:
          TEST_COMMANDS_JSON: ${{ inputs.test_commands_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          scripts_dir = Path(".agents/skills/cofounder-contributor/scripts").resolve()
          sys.path.insert(0, str(scripts_dir))

          import evidence

          commands = json.loads(os.environ["TEST_COMMANDS_JSON"])

          log_path = Path("test-output.txt")
          with log_path.open("w", encoding="utf-8") as log_file:
              for command in commands:
                  argv = evidence.safe_swift_test_command_args(command)
                  rendered = shlex.join(argv) if argv is not None else command
                  for stream in (sys.stdout, log_file):
                      stream.write(f"$ {rendered}\n")
                      stream.flush()

                  if argv is None:
                      message = (
                          "error: unsupported test command from evidence contract: "
                          f"{command}\n"
                      )
                      for stream in (sys.stdout, log_file):
                          stream.write(message)
                          stream.flush()
                      raise SystemExit(1)

                  result = subprocess.run(
                      argv,
                      cwd=str(Path.cwd()),
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  if result.stdout:
                      text = result.stdout
                      for stream in (sys.stdout, log_file):
                          stream.write(text)
                          if not text.endswith("\n"):
                              stream.write("\n")
                          stream.flush()
                  if result.returncode != 0:
                      raise SystemExit(result.returncode)
          PY

      - name: Capture evidence
        id: smoke
        if: steps.build.outcome == 'success' && inputs.needs_screenshot_evidence
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./scripts/dev-smoke.sh --no-build 2>&1 | tee dev-smoke-output.txt

      - name: Resolve PR number
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Could not resolve a PR number for branch: $PR_BRANCH" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload screenshot evidence to R2
        id: upload
        if: inputs.upload_screenshots && steps.smoke.outcome == 'success' && inputs.needs_screenshot_evidence
        shell: bash
        env:
          EVIDENCE_UPLOAD_TOKEN: ${{ secrets.EVIDENCE_UPLOAD_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(output/**/*.png)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PNG evidence files found under output/" >&2
            exit 1
          fi
          : > uploaded-screenshot-urls.tsv
          count=0
          for f in "${files[@]}"; do
            slug=$(basename "$f" .png)
            url=$(uv run scripts/upload-evidence.py "$f" \
              --repo workspaces --pr "$PR_NUMBER" --name "$slug" --breadcrumb)
            printf '%s\t%s\n' "$slug" "$url" >> uploaded-screenshot-urls.tsv
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Reconcile pending-ci evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BUILD_SUCCEEDED: ${{ steps.ghosttykit.outcome == 'success' && steps.build.outcome == 'success' }}
          TESTS_SUCCEEDED: ${{ inputs.test_commands_json == '[]' || steps.tests.outcome == 'success' }}
          SMOKE_SUCCEEDED: ${{ !inputs.needs_screenshot_evidence || steps.smoke.outcome == 'success' }}
          SCREENSHOT_UPLOAD_SUCCEEDED: ${{ !inputs.upload_screenshots || !inputs.needs_screenshot_evidence || steps.upload.outcome == 'success' }}
          UPLOAD_SCREENSHOTS: ${{ inputs.upload_screenshots }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body --jq '.body' > pr-body.md
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path

          module_path = Path(".agents/skills/cofounder-contributor/scripts/run-contributor.py")
          spec = importlib.util.spec_from_file_location("run_contributor", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          body_path = Path("pr-body.md")
          kwargs = dict(
              build_succeeded=os.environ["BUILD_SUCCEEDED"] == "true",
              tests_succeeded=os.environ["TESTS_SUCCEEDED"] == "true",
              smoke_succeeded=os.environ["SMOKE_SUCCEEDED"] == "true",
              test_output=Path("test-output.txt").read_text() if Path("test-output.txt").exists() else "",
          )

          if os.environ["UPLOAD_SCREENSHOTS"] == "true":
              kwargs["screenshot_upload_succeeded"] = os.environ["SCREENSHOT_UPLOAD_SUCCEEDED"] == "true"
              uploaded_urls = []
              uploaded_urls_path = Path("uploaded-screenshot-urls.tsv")
              if uploaded_urls_path.exists():
                  for line in uploaded_urls_path.read_text().splitlines():
                      if not line.strip():
                          continue
                      label, url = line.split("\t", 1)
                      uploaded_urls.append((label, url))
              kwargs["screenshot_urls"] = uploaded_urls

          reconciled = module.reconcile_pending_ci_evidence(body_path.read_text(), **kwargs)
          body_path.write_text(reconciled)
          PY
          gh pr edit "$PR_NUMBER" --body-file pr-body.md

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}
          path: |
            output/
            test-output.txt
            dev-smoke-output.txt

      - name: Fail on evidence errors
        if: always()
        shell: bash
        env:
          GHOSTTYKIT_OUTCOME: ${{ steps.ghosttykit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          UPLOADED_SCREENSHOT_COUNT: ${{ steps.upload.outputs.count }}
          TEST_COMMANDS_JSON: ${{ inputs.test_commands_json }}
          NEEDS_SCREENSHOT_EVIDENCE: ${{ inputs.needs_screenshot_evidence }}
          UPLOAD_SCREENSHOTS: ${{ inputs.upload_screenshots }}
        run: |
          set -euo pipefail
          if [ "$GHOSTTYKIT_OUTCOME" != "success" ] || [ "$BUILD_OUTCOME" != "success" ]; then
            echo "Build evidence failed"
            exit 1
          fi
          if [ "$TEST_COMMANDS_JSON" != "[]" ] && [ "$TESTS_OUTCOME" != "success" ]; then
            echo "Requested test evidence failed"
            exit 1
          fi
          if [ "$NEEDS_SCREENSHOT_EVIDENCE" = "true" ]; then
            if [ "$SMOKE_OUTCOME" != "success" ]; then
              echo "Screenshot evidence failed"
              exit 1
            fi
            if [ "$UPLOAD_SCREENSHOTS" = "true" ]; then
              if [ "$UPLOAD_OUTCOME" != "success" ] || [ "${UPLOADED_SCREENSHOT_COUNT:-0}" -lt 1 ]; then
                echo "Screenshot evidence upload failed"
                exit 1
              fi
            fi
          fi
