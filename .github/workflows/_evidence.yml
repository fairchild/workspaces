name: "Evidence: Build, Test, and Reconcile"

# Reusable workflow for post-patch evidence gathering.
# The gather job runs repo-authored code in an untrusted lane with no persisted
# git credentials or app/upload secrets. The reconcile job then consumes the
# artifacts in a trusted lane, updates PR evidence accounting, and uploads
# screenshots when requested.

on:
  workflow_call:
    inputs:
      pr_branch:
        required: true
        type: string
      pr_number:
        required: false
        type: string
        default: ""
      pr_head_sha:
        required: false
        type: string
        default: ""
      test_commands_json:
        required: true
        type: string
      needs_screenshot_evidence:
        required: false
        type: boolean
        default: false
      upload_screenshots:
        required: false
        type: boolean
        default: false
        description: "Upload screenshots to R2. When false, the workflow still gathers smoke artifacts."
      upload_text_evidence:
        required: false
        type: boolean
        default: false
        description: "Upload build and test logs to the standard evidence store."
      artifact_name:
        required: false
        type: string
        default: evidence
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true
      EVIDENCE_UPLOAD_TOKEN:
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gather:
    # Hosted, not self-hosted: the lume-macos lane is retired. Build and test
    # are already proven on this image by ci-fallback.yml. The screenshot step
    # below has not run on a hosted session before — it stays continue-on-error
    # so evidence degrades to build+test rather than failing the job.
    runs-on: macos-26
    # Sized for a cold hosted image, not a warm local runner. ci-fallback.yml
    # budgets 90 for the same build; 60 covers gather's narrower step list.
    timeout-minutes: 60
    outputs:
      build_succeeded: ${{ steps.ghosttykit.outcome == 'success' && steps.build.outcome == 'success' }}
      tests_succeeded: ${{ inputs.test_commands_json == '[]' || steps.tests.outcome == 'success' }}
      smoke_succeeded: ${{ !inputs.needs_screenshot_evidence || steps.smoke.outcome == 'success' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.pr_head_sha || inputs.pr_branch }}
          fetch-depth: 50
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Build GhosttyKit
        id: ghosttykit
        continue-on-error: true
        run: ./scripts/build-ghosttykit.sh

      - name: Build app
        id: build
        if: steps.ghosttykit.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          swift build 2>&1 | tee build-output.txt

      - name: Run requested tests
        id: tests
        if: steps.build.outcome == 'success' && inputs.test_commands_json != '[]'
        continue-on-error: true
        env:
          TEST_COMMANDS_JSON: ${{ inputs.test_commands_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          scripts_dir = Path(".agents/skills/cofounder-contributor/scripts").resolve()
          sys.path.insert(0, str(scripts_dir))

          import evidence

          commands = json.loads(os.environ["TEST_COMMANDS_JSON"])

          log_path = Path("test-output.txt")
          with log_path.open("w", encoding="utf-8") as log_file:
              for command in commands:
                  argv = evidence.safe_swift_test_command_args(command)
                  rendered = shlex.join(argv) if argv is not None else command
                  for stream in (sys.stdout, log_file):
                      stream.write(f"$ {rendered}\n")
                      stream.flush()

                  if argv is None:
                      message = (
                          "error: unsupported test command from evidence contract: "
                          f"{command}\n"
                      )
                      for stream in (sys.stdout, log_file):
                          stream.write(message)
                          stream.flush()
                      raise SystemExit(1)

                  result = subprocess.run(
                      argv,
                      cwd=str(Path.cwd()),
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  if result.stdout:
                      text = result.stdout
                      for stream in (sys.stdout, log_file):
                          stream.write(text)
                          if not text.endswith("\n"):
                              stream.write("\n")
                          stream.flush()
                  if result.returncode != 0:
                      raise SystemExit(result.returncode)
          PY

      - name: Capture evidence
        id: smoke
        if: steps.build.outcome == 'success' && inputs.needs_screenshot_evidence
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./scripts/dev-smoke.sh --no-build 2>&1 | tee dev-smoke-output.txt

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            output/
            build-output.txt
            test-output.txt
            dev-smoke-output.txt

  reconcile:
    needs: gather
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Download evidence artifacts
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_id }}
          path: evidence-artifacts

      - name: Resolve PR number
        id: pr
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_NUMBER="$PR_NUMBER_INPUT"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --state open --json number \
              --jq 'if length == 1 then .[0].number else empty end')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Could not resolve exactly one PR for branch: $PR_BRANCH" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            CURRENT_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
            if [ "$CURRENT_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
              echo "PR #$PR_NUMBER advanced after evidence dispatch" >&2
              exit 1
            fi
          else
            echo "::warning title=Evidence identity is not SHA-bound::pr_head_sha was not provided; reconciliation is using the mutable branch fallback"
          fi

      - name: Upload screenshot evidence to R2
        id: upload
        if: steps.pr.outcome == 'success' && inputs.upload_screenshots && inputs.needs_screenshot_evidence
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_UPLOAD_TOKEN: ${{ secrets.EVIDENCE_UPLOAD_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(evidence-artifacts/output/**/*.png)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PNG evidence files found under evidence-artifacts/output/" >&2
            exit 1
          fi
          : > uploaded-screenshot-urls.tsv
          count=0
          for f in "${files[@]}"; do
            slug=$(basename "$f" .png)
            url=$(uv run scripts/upload-evidence.py "$f" \
              --repo workspaces --pr "$PR_NUMBER" --name "$slug")
            printf '%s\t%s\n' "$slug" "$url" >> uploaded-screenshot-urls.tsv
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload text evidence to R2
        id: text-upload
        if: steps.pr.outcome == 'success' && inputs.upload_text_evidence
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_UPLOAD_TOKEN: ${{ secrets.EVIDENCE_UPLOAD_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          : > uploaded-text-urls.tsv
          count=0
          for f in evidence-artifacts/build-output.txt evidence-artifacts/test-output.txt; do
            if [ ! -f "$f" ]; then
              continue
            fi
            slug=$(basename "$f" .txt)
            url=$(uv run scripts/upload-evidence.py "$f" \
              --repo workspaces --pr "$PR_NUMBER" --name "$slug")
            printf '%s\t%s\n' "$slug" "$url" >> uploaded-text-urls.tsv
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "No build or test logs were available to upload." >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Reconcile pending-ci evidence
        id: reconcile
        if: always() && steps.pr.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BUILD_SUCCEEDED: ${{ needs.gather.outputs.build_succeeded }}
          TESTS_SUCCEEDED: ${{ needs.gather.outputs.tests_succeeded }}
          SMOKE_SUCCEEDED: ${{ needs.gather.outputs.smoke_succeeded }}
          SCREENSHOT_UPLOAD_SUCCEEDED: ${{ !inputs.upload_screenshots || !inputs.needs_screenshot_evidence || steps.upload.outcome == 'success' }}
          TEXT_UPLOAD_REQUIRED: ${{ inputs.upload_text_evidence }}
          TEXT_UPLOAD_SUCCEEDED: ${{ !inputs.upload_text_evidence || steps.text-upload.outcome == 'success' }}
          UPLOAD_SCREENSHOTS: ${{ inputs.upload_screenshots }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body --jq '.body' > pr-body.md
          # The contract the authoritative gate reads. Without it the
          # reconciler has to guess where a status item ends, and it refuses
          # to act whenever the guess decides which lane owns the item (#1551).
          # Exactly one linked issue IN THIS REPOSITORY, or none: a closing
          # reference carries its own repository, and a number alone would
          # read this repo's issue of that number -- a different contract
          # entirely, which is how the wrong lane completes a line. Two
          # contracts cannot both be this PR's either, so the ambiguous case
          # falls back to reconciling with none, which is the prior behavior.
          ISSUE_NUMBER=$(gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq '
            [.closingIssuesReferences[]
             | select((.repository.owner.login + "/" + .repository.name) == env.GITHUB_REPOSITORY)
             | .number]
            | if length == 1 then .[0] else empty end')
          : > issue-body.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > issue-body.md
          else
            echo "::warning title=Evidence reconcile has no contract::the PR closes no single issue in this repository; ambiguous status lines will be left pending"
          fi
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          module_path = Path(".agents/skills/cofounder-contributor/scripts/run-contributor.py")
          spec = importlib.util.spec_from_file_location("run_contributor", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          body_path = Path("pr-body.md")
          issue_body_path = Path("issue-body.md")
          test_output_path = Path("evidence-artifacts/test-output.txt")
          kwargs = dict(
              requested_evidence=module.extract_requested_evidence(
                  issue_body_path.read_text()
              ),
              build_succeeded=os.environ["BUILD_SUCCEEDED"] == "true",
              tests_succeeded=os.environ["TESTS_SUCCEEDED"] == "true",
              smoke_succeeded=os.environ["SMOKE_SUCCEEDED"] == "true",
              test_output=test_output_path.read_text() if test_output_path.exists() else "",
          )

          if os.environ["UPLOAD_SCREENSHOTS"] == "true":
              kwargs["screenshot_upload_succeeded"] = os.environ["SCREENSHOT_UPLOAD_SUCCEEDED"] == "true"
              uploaded_urls = []
              uploaded_urls_path = Path("uploaded-screenshot-urls.tsv")
              if uploaded_urls_path.exists():
                  for line in uploaded_urls_path.read_text().splitlines():
                      if not line.strip():
                          continue
                      label, url = line.split("\t", 1)
                      uploaded_urls.append((label, url))
              kwargs["screenshot_urls"] = uploaded_urls

          kwargs["text_upload_required"] = os.environ["TEXT_UPLOAD_REQUIRED"] == "true"
          kwargs["text_upload_succeeded"] = os.environ["TEXT_UPLOAD_SUCCEEDED"] == "true"
          uploaded_text_urls = []
          uploaded_text_urls_path = Path("uploaded-text-urls.tsv")
          if uploaded_text_urls_path.exists():
              for line in uploaded_text_urls_path.read_text().splitlines():
                  if not line.strip():
                      continue
                  label, url = line.split("\t", 1)
                  uploaded_text_urls.append((label, url))
          kwargs["text_urls"] = uploaded_text_urls

          reconciled = module.reconcile_pending_ci_evidence(body_path.read_text(), **kwargs)
          body_path.write_text(reconciled)
          PY
          gh pr edit "$PR_NUMBER" --body-file pr-body.md

      - name: Fail on evidence errors
        if: always()
        shell: bash
        env:
          GATHER_RESULT: ${{ needs.gather.result }}
          BUILD_SUCCEEDED: ${{ needs.gather.outputs.build_succeeded }}
          TESTS_SUCCEEDED: ${{ needs.gather.outputs.tests_succeeded }}
          SMOKE_SUCCEEDED: ${{ needs.gather.outputs.smoke_succeeded }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          UPLOADED_SCREENSHOT_COUNT: ${{ steps.upload.outputs.count }}
          TEXT_UPLOAD_OUTCOME: ${{ steps.text-upload.outcome }}
          UPLOADED_TEXT_COUNT: ${{ steps.text-upload.outputs.count }}
          TEST_COMMANDS_JSON: ${{ inputs.test_commands_json }}
          NEEDS_SCREENSHOT_EVIDENCE: ${{ inputs.needs_screenshot_evidence }}
          UPLOAD_SCREENSHOTS: ${{ inputs.upload_screenshots }}
          UPLOAD_TEXT_EVIDENCE: ${{ inputs.upload_text_evidence }}
          PR_RESOLUTION_OUTCOME: ${{ steps.pr.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          set -euo pipefail
          if [ "$PR_RESOLUTION_OUTCOME" != "success" ]; then
            echo "PR identity or immutable head verification failed"
            exit 1
          fi
          if [ "$GATHER_RESULT" != "success" ]; then
            echo "Evidence gather job failed unexpectedly"
            exit 1
          fi
          if [ "$BUILD_SUCCEEDED" != "true" ]; then
            echo "Build evidence failed"
            exit 1
          fi
          if [ "$TEST_COMMANDS_JSON" != "[]" ] && [ "$TESTS_SUCCEEDED" != "true" ]; then
            echo "Requested test evidence failed"
            exit 1
          fi
          if [ "$NEEDS_SCREENSHOT_EVIDENCE" = "true" ]; then
            if [ "$SMOKE_SUCCEEDED" != "true" ]; then
              echo "Screenshot evidence failed"
              exit 1
            fi
            if [ "$UPLOAD_SCREENSHOTS" = "true" ]; then
              if [ "$UPLOAD_OUTCOME" != "success" ] || [ "${UPLOADED_SCREENSHOT_COUNT:-0}" -lt 1 ]; then
                echo "Screenshot evidence upload failed"
                exit 1
              fi
            fi
          fi
          if [ "$UPLOAD_TEXT_EVIDENCE" = "true" ]; then
            if [ "$TEXT_UPLOAD_OUTCOME" != "success" ] || [ "${UPLOADED_TEXT_COUNT:-0}" -lt 1 ]; then
              echo "Text evidence upload failed"
              exit 1
            fi
          fi
          if [ "$RECONCILE_OUTCOME" != "success" ]; then
            echo "Evidence reconciliation failed"
            exit 1
          fi

      - name: Mark PR blocked when evidence fails
        if: failure() && steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh label create blocked:evidence --color B60205 \
            --description "Required merge evidence is unavailable" --force
          gh pr edit "$PR_NUMBER" --add-label blocked:evidence
