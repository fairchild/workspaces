name: Managed Reviewer Ingress

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare-webhook-relay/**"
      - "web/src/app/api/webhooks/github/**"
      - "web/src/lib/agent-runtime/pr-review*.ts"
      - "web/src/lib/agent-runtime/__tests__/pr-review*.ts"
      - ".github/workflows/managed-reviewer-ingress.yml"
  pull_request:
    paths:
      - "infra/cloudflare-webhook-relay/**"
      - "web/src/app/api/webhooks/github/**"
      - "web/src/lib/agent-runtime/pr-review*.ts"
      - "web/src/lib/agent-runtime/__tests__/pr-review*.ts"
      - ".github/workflows/managed-reviewer-ingress.yml"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  web-contract:
    name: Web reviewer route contract
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run webhook route contract tests
        run: pnpm exec vitest run src/app/api/webhooks/github/route.test.ts

  relay-contract:
    name: Cloudflare relay contract
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare-webhook-relay
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Bun
        run: npm install --global bun@1.3.11

      - name: Install relay dependencies
        run: bun install --frozen-lockfile

      - name: Run relay e2e
        run: bun run test:e2e

      - name: Validate Worker bundle
        run: bun run --bun wrangler deploy --dry-run

  production-canary:
    name: Production ingress canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run managed reviewer ingress canary
        env:
          WORKSPACES_WEBHOOK_CANARY_SECRET: ${{ secrets.WORKSPACES_WEBHOOK_CANARY_SECRET }}
        run: |
          if [ -z "$WORKSPACES_WEBHOOK_CANARY_SECRET" ]; then
            echo "::error::WORKSPACES_WEBHOOK_CANARY_SECRET is required for the production canary"
            exit 1
          fi

          response="$(
            curl --fail-with-body -sS -X POST \
              "https://webhooks.cloudcompute.com/canary/pr-review-ingress" \
              -H "X-Workspace-Webhook-Canary: ${WORKSPACES_WEBHOOK_CANARY_SECRET}"
          )"
          printf '%s\n' "$response"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["RESPONSE"])
          if (
              payload.get("ok") is not True
              or payload.get("canary") is not True
              or payload.get("wouldTrigger") is not True
              or payload.get("triggerKind") != "opened"
          ):
              print(f"Unexpected canary response: {payload}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Check recent reviewer run records
        env:
          WORKSPACES_WEBHOOK_CANARY_SECRET: ${{ secrets.WORKSPACES_WEBHOOK_CANARY_SECRET }}
        run: |
          monitor_response="$(
            curl --fail-with-body -sS \
              "https://spaces.cloudcompute.com/api/webhooks/github/pr-reviewer-monitor?windowMinutes=90" \
              -H "X-Workspace-Webhook-Canary: ${WORKSPACES_WEBHOOK_CANARY_SECRET}"
          )"
          printf '%s\n' "$monitor_response"
          RESPONSE="$monitor_response" python3 - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["RESPONSE"])
          if payload.get("ok") is not True:
              print(f"Reviewer run monitor failed: {payload}", file=sys.stderr)
              sys.exit(1)
          PY
