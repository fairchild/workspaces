name: Perf Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/perf-validation.yml
      - scripts/build-ghosttykit.sh
      - scripts/perf-baseline.sh
      - Sources/**
      - Tests/**
      - docs/performance-testing.md

concurrency:
  group: perf-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-validation:
    # Run perf validation on the dedicated Tart UI lane so app-launching checks
    # never contend with generic CI or the interactive desktop runner.
    runs-on: [self-hosted, tart-ui]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Ensure mise
        run: |
          if command -v mise >/dev/null 2>&1; then
            mise --version
          else
            brew install mise
          fi

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Build (debug)
        run: swift build

      - name: Capture perf baseline
        run: ./scripts/perf-baseline.sh 3 6 --record

      - name: Collect perf artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p perf-artifacts
          latest_dir="$(ls -td /tmp/workspaces-perf-baseline-* 2>/dev/null | head -n 1 || true)"

          if [[ -n "$latest_dir" ]]; then
            cp -R "$latest_dir" perf-artifacts/raw-baseline
          fi

          cp docs/performance/dashboard.md perf-artifacts/dashboard.md || true
          cp docs/performance/metrics-history.csv perf-artifacts/metrics-history.csv || true
          cp docs/performance/latest-summary.json perf-artifacts/latest-summary.json || true

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-dashboard-${{ github.run_id }}
          path: perf-artifacts
          if-no-files-found: warn
