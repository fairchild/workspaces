# Managed reviewer broker is the projection driver. It advances completed
# ReviewRuns into GitHub reviews/statuses without running ingress canaries or
# failing on unrelated monitor backlog.
name: Managed Reviewer Broker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/managed-reviewer-broker.yml"
      - "scripts/pr-reviewer-broker.py"
      - "scripts/test_security_hardening.py"
  pull_request:
    paths:
      - ".github/workflows/managed-reviewer-broker.yml"
      - "scripts/pr-reviewer-broker.py"
      - "scripts/test_security_hardening.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum completed ReviewRuns to process"
        default: "10"
        required: true
      repo:
        description: "Repository to reconcile"
        default: "fairchild/workspaces"
        required: true
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: managed-reviewer-broker
  cancel-in-progress: true

jobs:
  script-smoke:
    name: Validate broker driver script
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Check broker script help
        run: python3 scripts/pr-reviewer-broker.py --help

      - name: Check broker script requires secret
        run: |
          if python3 scripts/pr-reviewer-broker.py --timeout 0.1 2>broker.err; then
            echo "broker script unexpectedly succeeded without WORKSPACES_WEBHOOK_CANARY_SECRET" >&2
            exit 1
          fi
          grep -q "WORKSPACES_WEBHOOK_CANARY_SECRET is required" broker.err

  broker:
    name: Reconcile completed managed reviews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Run managed reviewer broker
        env:
          WORKSPACES_WEBHOOK_CANARY_SECRET: ${{ secrets.WORKSPACES_WEBHOOK_CANARY_SECRET }}
          BROKER_LIMIT: ${{ github.event.inputs.limit || '10' }}
          BROKER_REPO: ${{ github.event.inputs.repo || github.repository }}
        run: python3 scripts/pr-reviewer-broker.py --limit "$BROKER_LIMIT" --repo "$BROKER_REPO"
