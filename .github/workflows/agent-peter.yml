name: "Agent: Peter Planner"

on:
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      discussion_number:
        description: 'Discussion number to plan (skips approval check)'
        type: number
        required: false
      dry_run:
        description: 'Print the normalized plan without creating issues or comments'
        type: boolean
        default: false

permissions:
  contents: read
  discussions: write
  issues: write

concurrency:
  group: agent-peter-${{ inputs.discussion_number || github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run planner
        run: |
          if [ -n "${PETER_DISCUSSION_TOKEN}" ]; then
            export GH_TOKEN="${PETER_DISCUSSION_TOKEN}"
          fi
          ARGS=()
          if [ -n "${DISCUSSION_NUMBER}" ]; then
            ARGS+=(--discussion-number "$DISCUSSION_NUMBER")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          uv run .agents/scripts/run-planner.py "${ARGS[@]}"
        env:
          DISCUSSION_NUMBER: ${{ inputs.discussion_number }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PETER_DISCUSSION_TOKEN: ${{ secrets.PETER_DISCUSSION_TOKEN }}
