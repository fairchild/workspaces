name: "Agent: Peter Planner"

on:
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      discussion_number:
        description: 'Discussion number to plan (skips approval check)'
        type: number
        required: false
      dry_run:
        description: 'Print the normalized plan without creating issues or comments'
        type: boolean
        default: false
      message:
        description: 'Directed task (overrides normal priority order)'
        type: string
        default: ''

permissions:
  contents: read
  discussions: write
  issues: write

concurrency:
  group: agent-peter-${{ inputs.discussion_number || github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 50

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ secrets.WORKSPACE_AGENTS_APP_ID }}
          private-key: ${{ secrets.WORKSPACE_AGENTS_PRIVATE_KEY }}
      - name: Run planner
        run: |
          ARGS=()
          if [ -n "${DISCUSSION_NUMBER}" ]; then
            ARGS+=(--discussion-number "$DISCUSSION_NUMBER")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          uv run .agents/skills/peter-planner/scripts/run-planner.py "${ARGS[@]}"
        env:
          DISCUSSION_NUMBER: ${{ inputs.discussion_number }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          AGENT_MESSAGE: ${{ inputs.message }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
