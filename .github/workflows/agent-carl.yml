name: "Agent: Carl Community"

on:
  schedule:
    - cron: "0 14 * * *"   # Daily at 7:00am PT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print commentary without posting"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  discussions: write
  issues: read
  pull-requests: read

concurrency:
  group: agent-carl
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.AGENT_AUTOMATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 50

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Run Carl Community
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          uv run scripts/carl-community.py "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
