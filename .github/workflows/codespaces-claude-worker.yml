name: Codespaces Claude Worker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Main or an owner-repository branch to open in the Codespace"
        type: string
        default: "main"
      allow_ref_override:
        description: "Break-glass: allow a tag, SHA, pull ref, or otherwise non-owner branch ref"
        type: boolean
        default: false
      prompt:
        description: "Inline request text for Claude Code"
        type: string
        default: ""
      prompt_path:
        description: "Optional repo-relative file to append to the inline prompt"
        type: string
        default: ""
      machine:
        description: "Optional Codespaces machine type"
        type: string
        default: ""
      keep_running:
        description: "Keep the Codespace running after a successful Claude run"
        type: boolean
        default: false
      max_turns:
        description: "Claude max turns"
        type: string
        default: "20"
      idle_timeout_minutes:
        description: "Codespace idle timeout in minutes"
        type: string
        default: "30"
      retention_minutes:
        description: "Codespace retention period in minutes"
        type: string
        default: "1440"

permissions:
  contents: read

concurrency:
  group: codespaces-claude-worker-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    environment:
      name: codespaces-claude-break-glass
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Verify gh CLI
        run: gh --version

      - name: Validate worker ref
        env:
          WORKER_REF: ${{ inputs.ref }}
          ALLOW_REF_OVERRIDE: ${{ inputs.allow_ref_override }}
        run: |
          set -euo pipefail

          if [[ "$ALLOW_REF_OVERRIDE" == "true" ]]; then
            echo "::warning::Break-glass ref override enabled for '$WORKER_REF'."
            exit 0
          fi

          if [[ -z "$WORKER_REF" ]]; then
            echo "::error::Codespaces Claude worker ref must not be empty."
            exit 1
          fi

          if [[ "$WORKER_REF" == "main" ]]; then
            exit 0
          fi

          if [[ "$WORKER_REF" == refs/* ]]; then
            echo "::error::Ref '$WORKER_REF' is not allowed without allow_ref_override; use 'main' or an owner-repository branch name."
            exit 1
          fi

          git check-ref-format --branch "$WORKER_REF" >/dev/null
          if git ls-remote --exit-code --heads origin "$WORKER_REF" >/dev/null; then
            exit 0
          fi

          echo "::error::Ref '$WORKER_REF' is not main or an owner-repository branch. Enable allow_ref_override only for an approved break-glass run."
          exit 1

      - name: Launch Codespace Claude worker
        timeout-minutes: 165
        env:
          CODESPACES_WORKER_GITHUB_TOKEN: ${{ secrets.CODESPACES_WORKER_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CODESPACES_WORKER_GITHUB_TOKEN }}
          WORKER_REF: ${{ inputs.ref }}
          WORKER_PROMPT: ${{ inputs.prompt }}
          WORKER_PROMPT_PATH: ${{ inputs.prompt_path }}
          WORKER_MACHINE: ${{ inputs.machine }}
          WORKER_KEEP_RUNNING: ${{ inputs.keep_running }}
          WORKER_MAX_TURNS: ${{ inputs.max_turns }}
          WORKER_IDLE_TIMEOUT_MINUTES: ${{ inputs.idle_timeout_minutes }}
          WORKER_RETENTION_MINUTES: ${{ inputs.retention_minutes }}
        run: |
          set -euo pipefail

          mkdir -p .context

          ARGS=(
            --repo "$GITHUB_REPOSITORY"
            --ref "$WORKER_REF"
            --run-id "$GITHUB_RUN_ID"
            --max-turns "$WORKER_MAX_TURNS"
            --idle-timeout-minutes "$WORKER_IDLE_TIMEOUT_MINUTES"
            --retention-minutes "$WORKER_RETENTION_MINUTES"
            --output-json ".context/codespaces-claude-launch-result.json"
          )

          if [[ -n "$WORKER_PROMPT" ]]; then
            ARGS+=(--prompt "$WORKER_PROMPT")
          fi

          if [[ -n "$WORKER_PROMPT_PATH" ]]; then
            ARGS+=(--prompt-file "$WORKER_PROMPT_PATH")
          fi

          if [[ -n "$WORKER_MACHINE" ]]; then
            ARGS+=(--machine "$WORKER_MACHINE")
          fi

          if [[ "$WORKER_KEEP_RUNNING" == "true" ]]; then
            ARGS+=(--keep-running)
          fi

          uv run --script ./scripts/codespaces-claude-launch.py "${ARGS[@]}"

      - name: Publish workflow summary
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -f .context/codespaces-claude-launch-result.json ]]; then
            {
              echo "## Codespaces Claude worker"
              echo
              echo "No launcher summary was written."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(".context/codespaces-claude-launch-result.json").read_text(encoding="utf-8")
          )
          lines = [
              "## Codespaces Claude worker",
              "",
              f"- Codespace: `{payload.get('codespace_name', 'n/a')}`",
              f"- Web URL: {payload.get('codespace_url', 'n/a')}",
              f"- Request file: `{payload.get('request_file', 'n/a')}`",
              f"- Result dir: `{payload.get('result_dir', 'n/a')}`",
              f"- Stopped after run: `{payload.get('stopped_after_run', 'n/a')}`",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
