name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "workspaces-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-sign-notarize-release:
    # Release signing/notarization stays on the dedicated signing lane so it
    # never contends with generic CI or Tart UI automation.
    runs-on: [self-hosted, signing-host]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce release source branch policy
        run: |
          set -euo pipefail
          git fetch origin main --no-tags

          # For manual runs, allow:
          # - main branch
          # - explicit release tag refs (v* or workspaces-v*)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${GITHUB_REF}" in
              refs/heads/main)
                ;;
              refs/tags/v*|refs/tags/workspaces-v*)
                ;;
              *)
                echo "::error::Manual releases must target main or a release tag ref (current: ${GITHUB_REF})"
                exit 1
                ;;
            esac
          fi

          # For both manual and tag-triggered runs, require the target commit to
          # be reachable from origin/main.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Release commit ${GITHUB_SHA} is not on main branch history"
            exit 1
          fi

      - name: Release preflight — verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-preflight.sh "${GITHUB_SHA}" "${GITHUB_REPOSITORY}"

      - name: Validate release secrets
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
          APPLE_ID: ${{ vars.APPLE_ID != '' && vars.APPLE_ID || secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID != '' && vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()

          [[ -n "$APPLE_DEVELOPER_ID_CERT_BASE64" ]] || missing+=("APPLE_DEVELOPER_ID_CERT_BASE64")
          [[ -n "$APPLE_DEVELOPER_ID_CERT_PASSWORD" ]] || missing+=("APPLE_DEVELOPER_ID_CERT_PASSWORD")
          [[ -n "$APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" ]] || missing+=("APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64")
          [[ -n "$APPLE_ID" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_APP_PASSWORD" ]] || missing+=("APPLE_APP_PASSWORD")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required repository release config: ${missing[*]}"
            exit 1
          fi

      - name: Ensure mise
        run: |
          if command -v mise >/dev/null 2>&1; then
            mise --version
          else
            brew install mise
          fi

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Import signing certificate
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/workspaces-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          ORIGINAL_DEFAULT_KEYCHAIN="$(
            security default-keychain -d user 2>/dev/null | tr -d '"' || true
          )"
          ORIGINAL_KEYCHAIN_LIST="$(
            security list-keychains -d user 2>/dev/null \
            | sed -E 's/^[[:space:]]*"//; s/"$//' || true
          )"

          if ! (echo "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null); then
            echo "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 -D > "$CERT_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
            | head -n 1
          )"

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::No Developer ID Application certificate was found after import"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
          {
            echo "ORIGINAL_KEYCHAIN_LIST<<EOF"
            echo "$ORIGINAL_KEYCHAIN_LIST"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Prepare provisioning profile
        env:
          APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/workspaces-release.provisionprofile"

          if ! (echo "$APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH" 2>/dev/null); then
            echo "$APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          fi

          security cms -D -i "$PROFILE_PATH" >/dev/null
          echo "PROVISIONING_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Export signing environment
        env:
          APPLE_ID: ${{ vars.APPLE_ID != '' && vars.APPLE_ID || secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID != '' && vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=com.cloudcompute.workspaces" >> "$GITHUB_ENV"

      - name: Validate app version metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ./scripts/release-version.sh assert-tag-match "${GITHUB_REF_NAME}"

      - name: Build signed app
        run: ./scripts/build-release.sh

      - name: Verify signed app bundle
        run: ./scripts/verify-release-bundle.sh build/WorkspaceManager.app

      - name: Notarize and package DMG
        run: bash ./scripts/notarize.sh

      - name: Read release metadata
        id: meta
        run: |
          set -euo pipefail

          VERSION=$(./scripts/release-version.sh print)
          BUILD=$(./scripts/release-version.sh print-build)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
              TAG="v${VERSION}"
            else
              TAG="workspaces-v${VERSION}-main.${GITHUB_RUN_NUMBER}"
            fi
          fi
          DMG_PATH="build/WorkspaceManager-${VERSION}.dmg"

          if [[ ! -f "$DMG_PATH" ]]; then
            echo "::error::Expected DMG not found at $DMG_PATH"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || {
            echo "::error::gh CLI is required to publish releases"
            exit 1
          }

          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="Workspaces ${TAG}"
          DMG_PATH="${{ steps.meta.outputs.dmg_path }}"
          LATEST_DMG_PATH="build/WorkspaceManager-latest.dmg"
          GENERATED_NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          IS_PRERELEASE=false

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-[A-Za-z0-9]*|v[0-9]*.[0-9]*.[0-9]*-[A-Za-z0-9]*.*|workspaces-v*)
              IS_PRERELEASE=true
              ;;
          esac

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body' >"$GENERATED_NOTES_PATH"

            gh release upload "$TAG" "$DMG_PATH" "$LATEST_DMG_PATH" --clobber --repo "${GITHUB_REPOSITORY}"
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release edit "$TAG" \
                --title "$TITLE" \
                --notes-file "$GENERATED_NOTES_PATH" \
                --prerelease \
                --repo "${GITHUB_REPOSITORY}"
            else
              gh release edit "$TAG" \
                --title "$TITLE" \
                --notes-file "$GENERATED_NOTES_PATH" \
                --latest \
                --repo "${GITHUB_REPOSITORY}"
            fi
          else
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release create "$TAG" "$DMG_PATH" "$LATEST_DMG_PATH" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$TITLE" \
                --target "${GITHUB_SHA}" \
                --generate-notes \
                --prerelease \
                --latest=false
            else
              gh release create "$TAG" "$DMG_PATH" "$LATEST_DMG_PATH" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$TITLE" \
                --target "${GITHUB_SHA}" \
                --generate-notes \
                --latest
            fi
          fi

      - name: Cleanup keychain
        if: always()
        run: |
          set -euo pipefail
          # Restore prior keychain search/default state on shared self-hosted machines.
          if [[ -n "${ORIGINAL_KEYCHAIN_LIST:-}" ]]; then
            keychains=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && keychains+=("$line")
            done <<< "${ORIGINAL_KEYCHAIN_LIST}"
            if (( ${#keychains[@]} > 0 )); then
              security list-keychains -d user -s "${keychains[@]}" || true
            fi
          fi
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "${ORIGINAL_DEFAULT_KEYCHAIN}" || true
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" ]] && [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
