name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "workspaces-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sign-notarize-release:
    # Hosted. Signing and notarization take every credential from repository
    # secrets — the certificate is imported into a temporary keychain created
    # and destroyed by this job — so nothing here depends on a particular
    # machine's login keychain.
    runs-on: macos-15
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      tag: ${{ steps.meta.outputs.tag }}
      bundle_id: ${{ steps.meta.outputs.bundle_id }}
      sparkle_public_key: ${{ steps.meta.outputs.sparkle_public_key }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce release source branch policy
        run: |
          set -euo pipefail
          git fetch origin main --no-tags

          # For manual runs, allow:
          # - main branch
          # - explicit release tag refs (v* or workspaces-v*)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${GITHUB_REF}" in
              refs/heads/main)
                ;;
              refs/tags/v*|refs/tags/workspaces-v*)
                ;;
              *)
                echo "::error::Manual releases must target main or a release tag ref (current: ${GITHUB_REF})"
                exit 1
                ;;
            esac
          fi

          # For both manual and tag-triggered runs, require the target commit to
          # be reachable from origin/main.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Release commit ${GITHUB_SHA} is not on main branch history"
            exit 1
          fi

      - name: Release preflight — verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-preflight.sh "${GITHUB_SHA}" "${GITHUB_REPOSITORY}"

      - name: Validate release secrets
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()

          [[ -n "$APPLE_DEVELOPER_ID_CERT_BASE64" ]] || missing+=("APPLE_DEVELOPER_ID_CERT_BASE64")
          [[ -n "$APPLE_DEVELOPER_ID_CERT_PASSWORD" ]] || missing+=("APPLE_DEVELOPER_ID_CERT_PASSWORD")
          [[ -n "$APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" ]] || missing+=("APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64")
          [[ -n "$APPLE_API_KEY_BASE64" ]] || missing+=("APPLE_API_KEY_BASE64")
          [[ -n "$APPLE_API_KEY_ID" ]] || missing+=("APPLE_API_KEY_ID")
          [[ -n "$APPLE_API_ISSUER_ID" ]] || missing+=("APPLE_API_ISSUER_ID")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || missing+=("SPARKLE_PRIVATE_KEY")

          if (( ${#missing[@]} > 0 )); then
            # Empty and unset are the same value here, so the message names both
            # causes. An environment secret shadows the repository secret of the
            # same name even when the environment copy is empty, which presents
            # as a missing credential while a working repository value sits
            # underneath it.
            echo "::error::Release config resolved empty in this job's scope: ${missing[*]}"
            echo "Each name above is either unset or set to an empty value."
            echo "Secrets resolve environment-first: a value on the 'release' environment wins over"
            echo "the repository secret of the same name, including when it is empty. Check both scopes:"
            echo "  gh secret list --env release"
            echo "  gh secret list"
            echo "APPLE_TEAM_ID is a repository variable, not a secret: gh variable list"
            exit 1
          fi

      # Pinned by SHA like every other action here. mise resolves the toolchain
      # that builds the signed binary, so it must not be bootstrapped from an
      # unpinned source — the previous "fail closed, install it out of band"
      # rule protected that on a host we controlled, and a SHA-pinned action is
      # how the same guarantee is kept on an ephemeral hosted image.
      - name: Ensure mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # Refreshed by scripts/mise-pin-refresh.py, which finds this step by
          # scanning for jdx/mise-action rather than by carrying a roster.
          # Upstream prunes release assets from old versions, and this step
          # fails on a cache miss rather than at pin time, so an unrefreshed pin
          # here surfaces as a 404 mid-release (#1297).
          version: 2026.8.5
          install: true
          cache: true

      # check-perf-benchmarks.py and summarize_perf_log.py are UV scripts, and
      # .mise.toml does not provide uv — without this the job resolves it from
      # ambient PATH, which the hosted image does not carry.
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Import signing certificate
        id: signing
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/workspaces-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          ORIGINAL_DEFAULT_KEYCHAIN="$(
            security default-keychain -d user 2>/dev/null \
            | sed -E 's/^[[:space:]]*"//; s/"$//' || true
          )"
          ORIGINAL_KEYCHAIN_LIST="$(
            security list-keychains -d user 2>/dev/null \
            | sed -E 's/^[[:space:]]*"//; s/"$//' || true
          )"
          echo "cert_path=$CERT_PATH" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "original_default_keychain=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_OUTPUT"
          {
            echo "original_keychain_list<<EOF"
            echo "$ORIGINAL_KEYCHAIN_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if ! (echo "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null); then
            echo "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 -D > "$CERT_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add the release keychain to the user search list so codesign's
          # securityd lookups succeed even when --keychain isn't passed.
          # The Cleanup keychain step at the end restores the original list.
          search_list_args=("$KEYCHAIN_PATH")
          if [[ -n "$ORIGINAL_KEYCHAIN_LIST" ]]; then
            while IFS= read -r kc; do
              [[ -n "$kc" ]] && search_list_args+=("$kc")
            done <<< "$ORIGINAL_KEYCHAIN_LIST"
          fi
          security list-keychains -d user -s "${search_list_args[@]}"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
            | head -n 1
          )"

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::No Developer ID Application certificate was found after import"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "signing_identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Prepare provisioning profile
        id: profile
        env:
          APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/workspaces-release.provisionprofile"
          echo "profile_path=$PROFILE_PATH" >> "$GITHUB_OUTPUT"

          if ! (echo "$APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH" 2>/dev/null); then
            echo "$APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          fi

          security cms -D -i "$PROFILE_PATH" >/dev/null

      - name: Notarization preflight
        id: notarization
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          echo "api_key_path=$API_KEY_PATH" >> "$GITHUB_OUTPUT"

          if ! (echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH" 2>/dev/null); then
            echo "$APPLE_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          fi
          chmod 600 "$API_KEY_PATH"

          if ! out=$(xcrun notarytool history \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" 2>&1); then
            echo "::error::Apple notarization API-key preflight failed:"
            echo "$out"
            exit 1
          fi
          echo "Notarization API-key credentials OK"

      - name: Validate app version metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ./scripts/release-version.sh assert-tag-match "${GITHUB_REF_NAME}"

      - name: Build signed app
        env:
          BUNDLE_ID: com.cloudcompute.workspaces
          CODESIGN_KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROVISIONING_PROFILE_PATH: ${{ steps.profile.outputs.profile_path }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing_identity }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: ./scripts/build-release.sh

      - name: Verify signed app bundle
        run: ./scripts/verify-release-bundle.sh build/WorkSpaces.app

      # Reads committed evidence instead of measuring. This job runs on a hosted
      # image with no display, where launching the app yields no launch telemetry
      # — that is what blocked v0.24.0. Perf is measured on a laptop, opt-in, per
      # docs/decisions/perf-measurement-laptop-optin.md, and recorded in
      # docs/performance_benchmarks.csv. Pass at 0 releases stale, warn at 1,
      # block at 2, and fail outright when the file is missing: #1238's rule is
      # that a skipped measurement must never read as a passing one.
      #
      # Graded against the version being built rather than the ref, because all
      # three entry points cut the same release: a `main` dispatch rehearsing
      # v<version>, the tester prerelease it publishes, and the v<version> tag
      # itself. On the tag path this is the ref — "Validate app version
      # metadata" above has already bound them.
      - name: Verify release performance benchmarks are current
        run: |
          set -euo pipefail
          ./scripts/check-perf-benchmarks.py \
            --tag "$(./scripts/release-version.sh print-tag)" \
            --format github

      - name: Notarize and package DMG
        env:
          APPLE_API_KEY_PATH: ${{ steps.notarization.outputs.api_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.cloudcompute.workspaces
          CODESIGN_KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROVISIONING_PROFILE_PATH: ${{ steps.profile.outputs.profile_path }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing_identity }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash ./scripts/notarize.sh

      - name: Read release metadata
        id: meta
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          VERSION=$(./scripts/release-version.sh print)
          BUILD=$(./scripts/release-version.sh print-build)

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="workspaces-v${VERSION}-main.${GITHUB_RUN_NUMBER}"
            echo "::notice::Manual Release dispatch from main publishes tester prerelease ${TAG}; push or dispatch a v<version> tag for stable releases"
          fi
          DMG_PATH="build/WorkSpaces-${VERSION}.dmg"
          APPCAST_PATH="build/appcast.xml"
          MANIFEST_PATH="build/release-manifest.json"
          INFO_PLIST="build/WorkSpaces.app/Contents/Info.plist"

          if [[ ! -f "$DMG_PATH" ]]; then
            echo "::error::Expected DMG not found at $DMG_PATH"
            exit 1
          fi
          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::Expected app Info.plist not found at $INFO_PLIST"
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST")"
          SPARKLE_PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$INFO_PLIST")"
          [[ -n "$TEAM_ID" ]] || { echo "::error::TEAM_ID is required"; exit 1; }
          [[ -n "$BUNDLE_ID" ]] || { echo "::error::CFBundleIdentifier is required"; exit 1; }
          [[ -n "$SPARKLE_PUBLIC_KEY" ]] || { echo "::error::SUPublicEDKey is required"; exit 1; }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "appcast_path=$APPCAST_PATH" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          # Keep team_id step-local. GitHub may redact it if exposed as a job
          # output, which breaks downstream validation.
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "sparkle_public_key=$SPARKLE_PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./scripts/generate-sparkle-appcast.sh \
            --dmg "${{ steps.meta.outputs.dmg_path }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output "${{ steps.meta.outputs.appcast_path }}"

      - name: Verify Sparkle appcast
        env:
          APPCAST_PATH: ${{ steps.meta.outputs.appcast_path }}
          BUILD: ${{ steps.meta.outputs.build }}
          DMG_PATH: ${{ steps.meta.outputs.dmg_path }}
          SPARKLE_PUBLIC_KEY: ${{ steps.meta.outputs.sparkle_public_key }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/verify-sparkle-appcast.swift \
            --appcast "$APPCAST_PATH" \
            --dmg "$DMG_PATH" \
            --public-key "$SPARKLE_PUBLIC_KEY" \
            --expected-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WorkSpaces-${VERSION}.dmg" \
            --expected-version "$BUILD" \
            --expected-short-version "$VERSION"

      - name: Generate release manifest
        env:
          BUILD: ${{ steps.meta.outputs.build }}
          DMG_PATH: ${{ steps.meta.outputs.dmg_path }}
          APPCAST_PATH: ${{ steps.meta.outputs.appcast_path }}
          MANIFEST_PATH: ${{ steps.meta.outputs.manifest_path }}
          TAG: ${{ steps.meta.outputs.tag }}
          TEAM_ID: ${{ steps.meta.outputs.team_id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release-manifest.sh generate \
            --output "$MANIFEST_PATH" \
            --commit "$GITHUB_SHA" \
            --tag "$TAG" \
            --version "$VERSION" \
            --build "$BUILD" \
            --app build/WorkSpaces.app \
            --dmg "$DMG_PATH" \
            --latest-dmg build/WorkSpaces-latest.dmg \
            --appcast "$APPCAST_PATH" \
            --team-id "$TEAM_ID"

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets-${{ github.run_id }}
          path: |
            ${{ steps.meta.outputs.dmg_path }}
            build/WorkSpaces-latest.dmg
            ${{ steps.meta.outputs.appcast_path }}
            ${{ steps.meta.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        env:
          APPLE_API_KEY_PATH: ${{ steps.notarization.outputs.api_key_path }}
          CERT_PATH: ${{ steps.signing.outputs.cert_path }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          ORIGINAL_DEFAULT_KEYCHAIN: ${{ steps.signing.outputs.original_default_keychain }}
          ORIGINAL_KEYCHAIN_LIST: ${{ steps.signing.outputs.original_keychain_list }}
          PROFILE_PATH: ${{ steps.profile.outputs.profile_path }}
        run: |
          set -euo pipefail
          # Restore prior keychain search/default state on shared self-hosted machines.
          if [[ -n "${ORIGINAL_KEYCHAIN_LIST:-}" ]]; then
            keychains=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && keychains+=("$line")
            done <<< "${ORIGINAL_KEYCHAIN_LIST}"
            if (( ${#keychains[@]} > 0 )); then
              security list-keychains -d user -s "${keychains[@]}" || true
            fi
          fi
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "${ORIGINAL_DEFAULT_KEYCHAIN}" || true
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" ]] && [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          cleanup_files=(
            "${CERT_PATH:-}"
            "${PROFILE_PATH:-}"
            "${APPLE_API_KEY_PATH:-}"
          )
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            cleanup_files+=(
              "$RUNNER_TEMP/developer-id-application.p12"
              "$RUNNER_TEMP/workspaces-release.provisionprofile"
              "$RUNNER_TEMP/notary-api-key.p8"
            )
          fi
          for file in "${cleanup_files[@]}"; do
            if [[ -n "$file" ]] && [[ -f "$file" ]]; then
              rm -f "$file" || true
            fi
          done
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            rm -f "$KEYCHAIN_PATH" "$KEYCHAIN_PATH-shm" "$KEYCHAIN_PATH-wal" || true
          fi

  publish-github-release:
    needs: build-sign-notarize-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ github.run_id }}
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || {
            echo "::error::gh CLI is required to publish releases"
            exit 1
          }

          TAG="${{ needs.build-sign-notarize-release.outputs.tag }}"
          VERSION="${{ needs.build-sign-notarize-release.outputs.version }}"
          TITLE="WorkSpaces ${TAG}"
          DMG_PATH="$(find release-assets -type f -name "WorkSpaces-${VERSION}.dmg" -print -quit)"
          APPCAST_PATH="$(find release-assets -type f -name "appcast.xml" -print -quit)"
          LATEST_DMG_PATH="$(find release-assets -type f -name "WorkSpaces-latest.dmg" -print -quit)"
          MANIFEST_PATH="$(find release-assets -type f -name "release-manifest.json" -print -quit)"
          GENERATED_NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          IS_PRERELEASE=false

          for asset in "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" "$MANIFEST_PATH"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Release artifact missing: $asset"
              exit 1
            fi
          done

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-[A-Za-z0-9]*|v[0-9]*.[0-9]*.[0-9]*-[A-Za-z0-9]*.*|workspaces-v*)
              IS_PRERELEASE=true
              ;;
          esac

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body' >"$GENERATED_NOTES_PATH"

            gh release upload "$TAG" "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" "$MANIFEST_PATH" --clobber --repo "${GITHUB_REPOSITORY}"
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release edit "$TAG" \
                --title "$TITLE" \
                --notes-file "$GENERATED_NOTES_PATH" \
                --prerelease \
                --repo "${GITHUB_REPOSITORY}"
            else
              gh release edit "$TAG" \
                --title "$TITLE" \
                --notes-file "$GENERATED_NOTES_PATH" \
                --latest \
                --repo "${GITHUB_REPOSITORY}"
            fi
          else
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release create "$TAG" "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" "$MANIFEST_PATH" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$TITLE" \
                --target "${GITHUB_SHA}" \
                --generate-notes \
                --prerelease \
                --latest=false
            else
              gh release create "$TAG" "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" "$MANIFEST_PATH" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$TITLE" \
                --target "${GITHUB_SHA}" \
                --generate-notes \
                --latest
            fi
          fi

  validate-published-release-assets:
    needs:
      - build-sign-notarize-release
      - publish-github-release
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-sign-notarize-release.outputs.tag }}
          VERSION: ${{ needs.build-sign-notarize-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-downloads
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "WorkSpaces-${VERSION}.dmg" \
            --pattern "WorkSpaces-latest.dmg" \
            --pattern "appcast.xml" \
            --pattern "release-manifest.json" \
            --dir release-downloads

      - name: Validate published release assets
        env:
          BUILD: ${{ needs.build-sign-notarize-release.outputs.build }}
          BUNDLE_ID: ${{ needs.build-sign-notarize-release.outputs.bundle_id }}
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPECTED_SPARKLE_PUBLIC_KEY: ${{ needs.build-sign-notarize-release.outputs.sparkle_public_key }}
          TAG: ${{ needs.build-sign-notarize-release.outputs.tag }}
          VERSION: ${{ needs.build-sign-notarize-release.outputs.version }}
        run: |
          set -euo pipefail

          DMG_PATH="release-downloads/WorkSpaces-${VERSION}.dmg"
          LATEST_DMG_PATH="release-downloads/WorkSpaces-latest.dmg"
          APPCAST_PATH="release-downloads/appcast.xml"
          MANIFEST_PATH="release-downloads/release-manifest.json"
          COMMITTED_SPARKLE_PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" Sources/WorkspaceManager/Resources/Info.plist)"

          if [[ -z "$EXPECTED_TEAM_ID" ]]; then
            echo "::error::APPLE_TEAM_ID repository variable is required for post-publish release validation"
            exit 1
          fi
          for asset in "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" "$MANIFEST_PATH"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Published release asset missing: $asset"
              exit 1
            fi
          done
          if [[ "$COMMITTED_SPARKLE_PUBLIC_KEY" != "$EXPECTED_SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::Workflow Sparkle public key does not match committed SUPublicEDKey"
            exit 1
          fi

          shasum -a 256 "$DMG_PATH" "$LATEST_DMG_PATH" "$APPCAST_PATH" "$MANIFEST_PATH"
          if ! cmp -s "$DMG_PATH" "$LATEST_DMG_PATH"; then
            echo "::error::Latest DMG asset does not match versioned DMG asset"
            exit 1
          fi

          xmllint --noout "$APPCAST_PATH"
          grep -Fq "releases/download/${TAG}/WorkSpaces-${VERSION}.dmg" "$APPCAST_PATH"
          grep -Fq "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "$APPCAST_PATH"
          grep -Fq "<sparkle:version>${BUILD}</sparkle:version>" "$APPCAST_PATH"
          ./scripts/verify-sparkle-appcast.swift \
            --appcast "$APPCAST_PATH" \
            --dmg "$DMG_PATH" \
            --public-key "$COMMITTED_SPARKLE_PUBLIC_KEY" \
            --expected-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WorkSpaces-${VERSION}.dmg" \
            --expected-version "$BUILD" \
            --expected-short-version "$VERSION"
          ./scripts/release-manifest.sh validate \
            --manifest "$MANIFEST_PATH" \
            --commit "$GITHUB_SHA" \
            --tag "$TAG" \
            --version "$VERSION" \
            --build "$BUILD" \
            --dmg "$DMG_PATH" \
            --latest-dmg "$LATEST_DMG_PATH" \
            --appcast "$APPCAST_PATH" \
            --bundle-id "$BUNDLE_ID" \
            --team-id "$EXPECTED_TEAM_ID" \
            --sparkle-public-key "$COMMITTED_SPARKLE_PUBLIC_KEY"

          hdiutil imageinfo "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"
