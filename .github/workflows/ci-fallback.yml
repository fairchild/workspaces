name: CI Fallback

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-test-fallback:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: [self-hosted, lume-macos]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Log trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "conclusion=${{ github.event.workflow_run.conclusion || 'manual' }}"
          echo "upstream_run_id=${{ github.event.workflow_run.id || 'n/a' }}"

      - name: Checkout triggering commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v5

      - name: Ensure mise
        run: |
          if command -v mise >/dev/null 2>&1; then
            mise --version
          else
            brew install mise
          fi

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Ensure swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format --version
          else
            brew install swift-format
          fi

      - name: Lint
        run: swift-format lint --strict --recursive Sources/ Tests/

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
