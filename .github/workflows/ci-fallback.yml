name: CI Fallback

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ci-fallback-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-fallback:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    # Transitional fallback while we move toward an explicit Xcode build
    # trigger. Do not run failed PR heads on persistent self-hosted runners.
    #
    # This job is a retry of the ordinary build, not a substitute for CI's
    # `build-and-test`, and no release gate accepts it as one. It skips every
    # release-shaped step — the `build-release.sh --no-sign` bundling path and
    # its structure check, the perf-gate runnability probe, the release-harness
    # absence check, the subprocess-timeout tripwire, the isolated render suite
    # — and provisions differently: no pinned mise, no Zig from mise.lock, no
    # uv, and a shallow checkout where ci.yml takes fetch-depth 0 on purpose.
    #
    # Its check-runs are also not evidence about the commit they appear on. A
    # `workflow_run` job executes on the default branch, so GitHub attaches
    # this job's check-run to main's head even when the CI run that triggered
    # it was on a pull request branch.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Log trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "conclusion=${{ github.event.workflow_run.conclusion || 'manual' }}"
          echo "upstream_run_id=${{ github.event.workflow_run.id || 'n/a' }}"

      - name: Checkout triggering commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Ensure mise
        run: |
          if command -v mise >/dev/null 2>&1; then
            mise --version
          else
            brew install mise
          fi

      - name: Build GhosttyKit
        run: ./scripts/build-ghosttykit.sh

      - name: Ensure swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format --version
          else
            brew install swift-format
          fi

      - name: Lint
        run: swift-format lint --strict --recursive Sources/ Tests/

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
