name: "Agent: Plat Ironwood"

on:
  schedule:
    - cron: '30 14 * * 1,3,5'  # Mon/Wed/Fri second (7:30am PT)
    - cron: '0 14 * * 2,4'     # Tue/Thu first (7:00am PT)
    - cron: '30 16,20,0 * * 0,6' # Weekends every other hour offset (9:30am/1:30pm/5:30pm PT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print output without posting'
        type: boolean
        default: false
      message:
        description: 'Directed task (overrides normal priority order)'
        type: string
        default: ''

permissions:
  contents: read
  discussions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-plat
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: astral-sh/setup-uv@v7
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WORKSPACE_AGENTS_APP_ID }}
          private-key: ${{ secrets.WORKSPACE_AGENTS_PRIVATE_KEY }}
      - name: Run contributor
        run: |
          ARGS=(--prompt-file .agents/skills/cofounder-contributor/references/plat-ironwood.md)
          ARGS+=(--mode cli)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$AGENT_MESSAGE" ]; then
            ARGS+=(--message "$AGENT_MESSAGE")
          fi
          uv run .agents/skills/cofounder-contributor/scripts/run-contributor.py "${ARGS[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          AGENT_MESSAGE: ${{ inputs.message }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: workspace-agents
