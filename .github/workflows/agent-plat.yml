name: "Agent: Plat Ironwood"

on:
  schedule:
    - cron: '30 14 * * 1,3,5'  # Mon/Wed/Fri second (7:30am PT)
    - cron: '0 14 * * 2,4'     # Tue/Thu first (7:00am PT)
    - cron: '30 16,20,0 * * 0,6' # Weekends every other hour offset (9:30am/1:30pm/5:30pm PT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print output without posting'
        type: boolean
        default: false
      message:
        description: 'Directed task (overrides normal priority order)'
        type: string
        default: ''

permissions:
  contents: write
  discussions: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-plat
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'schedule' || vars.AGENT_SCHEDULED_RUNS_ENABLED == 'true'
    # Contributor automation is CLI-only; keep it on the broadly available hosted lane.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      needs_macos_evidence: ${{ steps.contributor.outputs.needs_macos_evidence }}
      needs_screenshot_evidence: ${{ steps.contributor.outputs.needs_screenshot_evidence }}
      pr_branch: ${{ steps.contributor.outputs.pr_branch }}
      test_commands_json: ${{ steps.contributor.outputs.test_commands_json }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ secrets.WORKSPACE_AGENTS_APP_ID }}
          private-key: ${{ secrets.WORKSPACE_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 50
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Resolve directed PR workspace
        id: resolve-pr
        if: inputs.message != ''
        env:
          AGENT_MESSAGE: ${{ inputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AGENT_MESSAGE" =~ [Pp][Rr][[:space:]]#([0-9]+) ]]; then
            echo "pr_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "model_cwd=$GITHUB_WORKSPACE/model-workspace" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout directed PR workspace
        if: steps.resolve-pr.outputs.pr_number != ''
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refs/pull/${{ steps.resolve-pr.outputs.pr_number }}/head
          fetch-depth: 1
          path: model-workspace
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Sync execution state
        run: uv run .agents/skills/cofounder-contributor/scripts/sync-execution-state.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Run contributor
        id: contributor
        run: |
          ARGS=(--prompt-file .agents/skills/cofounder-contributor/references/plat-ironwood.md)
          ARGS+=(--mode cli)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$AGENT_MESSAGE" ]; then
            ARGS+=(--message "$AGENT_MESSAGE")
          fi
          uv run .agents/skills/cofounder-contributor/scripts/run-contributor.py "${ARGS[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          AGENT_MESSAGE: ${{ inputs.message }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: workspace-agents
          CONTRIBUTOR_MODEL_CWD: ${{ steps.resolve-pr.outputs.model_cwd }}

  evidence:
    needs: run
    if: needs.run.outputs.needs_macos_evidence == 'true'
    uses: ./.github/workflows/_evidence.yml
    with:
      pr_branch: ${{ needs.run.outputs.pr_branch }}
      test_commands_json: ${{ needs.run.outputs.test_commands_json }}
      needs_screenshot_evidence: ${{ needs.run.outputs.needs_screenshot_evidence == 'true' }}
      upload_screenshots: false
      artifact_name: evidence
    secrets:
      APP_ID: ${{ secrets.WORKSPACE_AGENTS_APP_ID }}
      PRIVATE_KEY: ${{ secrets.WORKSPACE_AGENTS_PRIVATE_KEY }}
