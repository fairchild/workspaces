[settings]
lockfile = true

[tools]
zig = "0.16.0"

[tasks.setup]
description = "Bootstrap this checkout with tools, dependencies, env links, and prek hooks."
run = "./scripts/setup"

[tasks."hooks-install"]
description = "Install or refresh prek git hooks without running dependency setup."
run = "./scripts/setup --hooks-only"

[tasks.build-ghosttykit]
description = "Build GhosttyKit.xcframework (required once or after pin changes)."
run = "./scripts/build-ghosttykit.sh"

[tasks.lint]
description = "Lint Swift formatting without modifying files."
run = "swift-format lint --strict --recursive Sources/ Tests/"

[tasks.build]
description = "Build the WorkspaceManager app."
run = "swift build"

[tasks.test]
description = "Run the test suite."
run = "swift test"

[tasks.check]
description = "Run the local Swift validation gate: lint, build, and tests."
run = """
set -e
swift-format lint --strict --recursive Sources/ Tests/
swift build
swift test
"""

[tasks."check-release-harness"]
description = "Release-build the app and prove the debug smoke/fixture harness is compiled out (#1235)."
run = """
set -e
swift build -c release
./scripts/check-release-harness-absence.sh
"""

[tasks."dev-launch"]
description = "Launch the debug app and require a visible window."
run = "./scripts/launch-dev.sh"

[tasks."dev-watch"]
description = "Launch the debug app, verify a visible window, and tail logs until interrupted."
run = "./scripts/launch-dev.sh --watch"

[tasks."dev-smoke"]
description = "Launch the debug app, verify a visible window, and capture a screenshot."
run = "./scripts/dev-smoke.sh"

[tasks."dev-settings-smoke"]
description = "Verify Settings opens from Cmd+, and the app menu using Accessibility."
run = "./scripts/settings-window-smoke.sh"

[tasks."dev-ui-smoke"]
description = "Drive the daily-driver desktop flows (create workspace, terminal follows selection) end to end."
run = "./scripts/desktop-ui-smoke.sh"
usage = "[--no-build] [--keep-artifacts] [--timeout-seconds <n>] [--inactivity-seconds <n>]"

[tasks."dev-api-ui-smoke"]
description = "Drive the daily-driver desktop flows through operator workspace create/select verbs."
run = "./scripts/api-desktop-ui-smoke.sh"
usage = "[--no-build] [--keep-artifacts] [--timeout-seconds <n>]"

[tasks."dev-ui-smoke-parity"]
description = "Run UI and API desktop smoke lanes repeatedly and write a milestone parity report."
run = "uv run --script scripts/desktop-ui-smoke-parity.py"
usage = "[--runs <n>] [--no-build] [--timeout-seconds <n>]"

[tasks."claude-integration-smoke"]
description = "Run the interactive Claude Code integration smoke and evidence capture harness."
run = "./scripts/claude-integration-smoke.sh"
usage = "--pr <number> [--no-build] [--fixture-home] [--post-comment]"

[tasks."verify-shortcuts"]
description = "Smoke-test Ghostty shortcut pass-through (Cmd+D, Cmd+[ and Cmd+]) with log evidence."
run = "./scripts/shortcut-pass-through-smoke.sh"

[tasks."verify-open-shortcut"]
description = "Smoke-test Cmd+Shift+O editor launch shortcut flows (repo-only + file-selected)."
run = "./scripts/open-in-editor-shortcut-smoke.sh"

[tasks."verify-dev"]
description = "Run the debug verification loop (build, pinned launch, process-path check, capture)."
run = """
set -euo pipefail
./scripts/build-ghosttykit.sh
swift build
if pgrep -f '/Applications/WorkSpaces.app/Contents/MacOS/WorkspaceManager' >/dev/null 2>&1; then
  echo "ERROR: /Applications/WorkSpaces.app is running; quit it before verify-dev"
  exit 1
fi
./scripts/launch-dev.sh --no-build --no-activate
if pgrep -f '/Applications/WorkSpaces.app/Contents/MacOS/WorkspaceManager' >/dev/null 2>&1; then
  echo "ERROR: /Applications/WorkSpaces.app started unexpectedly during verify-dev"
  exit 1
fi
ps aux | rg '.build/arm64-apple-macosx/debug/WorkspaceManager'
./scripts/capture-window.sh
echo "Manual checks:"
echo "  Cmd+B toggles left sidebar"
echo "  Cmd+D creates a visible right split"
"""

[tasks.install]
description = "Install app to /Applications using the install script."
run = "./scripts/install-local.sh"

[tasks."docs:serve"]
description = "Serve the local WorkSpaces docs site."
run = "uv run --script docs/server.py"

[tasks."lume-status"]
description = "Compact VM status (use --stale to find cleanup candidates)."
run = "uv run --script ./scripts/lume-status.py"

[tasks."dev-lume-ensure"]
description = "Ensure Lume daemon is running (idempotent, self-healing)."
run = "./scripts/lume-ensure-daemon.sh"

[tasks."dev-lume-preflight"]
description = "Validate this Mac for a real-host Lume macOS VM smoke run."
run = "./scripts/lume-host-preflight.sh"

[tasks."dev-lume-standalone-preflight"]
description = "Validate the local Lume runtime directly, without the Swift app."
run = "./scripts/lume-standalone-preflight.sh"

[tasks."dev-lume-standalone-prepare-base"]
description = "Prepare or repair the standalone validated macOS base VM."
run = "./scripts/lume-standalone-prepare-base.sh"

[tasks."dev-lume-standalone-verify-base"]
description = "Boot and SSH-verify the standalone validated macOS base VM."
run = "./scripts/lume-standalone-verify-base.sh"

[tasks."dev-lume-standalone-clone-smoke"]
description = "Clone the standalone validated macOS base VM and verify SSH plus shared-dir behavior."
run = "./scripts/lume-standalone-clone-smoke.sh"

[tasks."dev-lume-standalone-validate"]
description = "Run the full standalone Lume validation gate before app-level smoke."
run = "./scripts/lume-standalone-validate.sh"

[tasks."dev-lume-macos-smoke"]
description = "Run the real-host Lume macOS VM smoke flow against the debug app."
run = "./scripts/lume-host-macos-smoke.sh"

[tasks.evidence]
description = "Capture screenshot and upload to R2 evidence store."
run = "./scripts/evidence.sh"
usage = "--pr <number> --name <slug> [--file <path>] [--no-capture]"

[tasks."factory-dashboard"]
description = "Sync Factory telemetry and render the local ops dashboard (docs/development/factory-current-state.md)."
run = "uv run --script scripts/factory-dashboard.py --sync --render"

[tasks."repo-settings-check"]
description = "Diff live GitHub repo settings (rulesets) against config/github/; exit 1 on drift."
run = "uv run --script scripts/github-settings.py check"

[tasks."repo-variables-check"]
description = "Diff config/github/repo-variables.json against live GitHub repo variables; runs unattended in repo-variables-drift.yml via toJSON(vars), or locally against gh variable list."
run = "uv run --script scripts/check-repo-variables.py"

[tasks."repo-settings-apply"]
description = "Push config/github/ ruleset files to GitHub (needs repo admin)."
run = "uv run --script scripts/github-settings.py apply"

[tasks."vercel-settings-check"]
description = "Diff live Vercel env vars (both projects) against config/vercel/; exit 1 on drift."
run = "uv run --script scripts/vercel-settings.py check"

[tasks."vercel-settings-apply"]
description = "Reconcile config/vercel/ manifest values to Vercel (secrets untouched; redeploy to activate)."
run = "uv run --script scripts/vercel-settings.py apply"
