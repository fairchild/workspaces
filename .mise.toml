[settings]
lockfile = true

[tools]
zig = "0.15.2"

[tasks.setup]
description = "Bootstrap this checkout with tools, dependencies, env links, and prek hooks."
run = "./scripts/setup"

[tasks."hooks-install"]
description = "Install or refresh prek git hooks without running dependency setup."
run = "./scripts/setup --hooks-only"

[tasks.build-ghosttykit]
description = "Build GhosttyKit.xcframework (required once or after pin changes)."
run = "./scripts/build-ghosttykit.sh"

[tasks.lint]
description = "Lint Swift formatting without modifying files."
run = "swift-format lint --strict --recursive Sources/ Tests/"

[tasks.build]
description = "Build the WorkspaceManager app."
run = "swift build"

[tasks.test]
description = "Run the test suite."
run = "swift test"

[tasks.check]
description = "Run the local Swift validation gate: lint, build, and tests."
run = """
set -e
swift-format lint --strict --recursive Sources/ Tests/
swift build
swift test
"""

[tasks."dev-launch"]
description = "Launch the debug app and require a visible window."
run = "./scripts/launch-dev.sh"

[tasks."dev-watch"]
description = "Launch the debug app, verify a visible window, and tail logs until interrupted."
run = "./scripts/launch-dev.sh --watch"

[tasks."dev-smoke"]
description = "Launch the debug app, verify a visible window, and capture a screenshot."
run = "./scripts/dev-smoke.sh"

[tasks."claude-integration-smoke"]
description = "Run the interactive Claude Code integration smoke and evidence capture harness."
run = "./scripts/claude-integration-smoke.sh"
usage = "--pr <number> [--no-build] [--fixture-home] [--post-comment]"

[tasks."lume-status"]
description = "Compact VM status (use --stale to find cleanup candidates)."
run = "uv run --script ./scripts/lume-status.py"

[tasks."dev-lume-ensure"]
description = "Ensure Lume daemon is running (idempotent, self-healing)."
run = "./scripts/lume-ensure-daemon.sh"

[tasks."dev-lume-preflight"]
description = "Validate this Mac for a real-host Lume macOS VM smoke run."
run = "./scripts/lume-host-preflight.sh"

[tasks."dev-lume-standalone-preflight"]
description = "Validate the local Lume runtime directly, without the Swift app."
run = "./scripts/lume-standalone-preflight.sh"

[tasks."dev-lume-standalone-prepare-base"]
description = "Prepare or repair the standalone validated macOS base VM."
run = "./scripts/lume-standalone-prepare-base.sh"

[tasks."dev-lume-standalone-verify-base"]
description = "Boot and SSH-verify the standalone validated macOS base VM."
run = "./scripts/lume-standalone-verify-base.sh"

[tasks."dev-lume-standalone-clone-smoke"]
description = "Clone the standalone validated macOS base VM and verify SSH plus shared-dir behavior."
run = "./scripts/lume-standalone-clone-smoke.sh"

[tasks."dev-lume-standalone-validate"]
description = "Run the full standalone Lume validation gate before app-level smoke."
run = "./scripts/lume-standalone-validate.sh"

[tasks."dev-lume-macos-smoke"]
description = "Run the real-host Lume macOS VM smoke flow against the debug app."
run = "./scripts/lume-host-macos-smoke.sh"

[tasks.evidence]
description = "Capture screenshot and upload to R2 evidence store."
run = "./scripts/evidence.sh"
usage = "--pr <number> --name <slug> [--file <path>] [--no-capture]"
