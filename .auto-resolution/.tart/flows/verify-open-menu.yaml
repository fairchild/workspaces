# Flow: Verify the "Open" toolbar dropdown works
# Agent-readable recipe — not directly executable by the harness.
# Read landmarks from ../target.yaml, issue harness commands.

name: verify-open-menu
description: >
  Open the "Open" toolbar menu button and verify the dropdown appears
  with expected menu items. Requires the app to be frontmost with a
  workspace selected in the sidebar.

preconditions:
  - app_running: true
  - workspace_selected: true

steps:
  - action: capture
    output: pre-click.png
    note: "Baseline before opening menu"

  - action: click
    landmark: toolbar_open_menu
    wait_ms: 500
    note: "Click the 'Open' dropdown button (full mousePress, not hold)"

  - action: capture
    output: post-click.png
    note: "Should show dropdown with menu items"

  - action: send_keys
    keys: esc
    wait_ms: 300
    note: "Dismiss the dropdown"

  - action: capture
    output: dismissed.png
    note: "Dropdown should be gone"

verify: >
  post-click.png should show a dropdown menu containing
  "Reveal in Finder" and "Copy Path" as text options.
