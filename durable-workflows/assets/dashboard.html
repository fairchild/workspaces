<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#x26A1;</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0e1117;
  --bg-surface: #141821;
  --bg-elevated: #1a1f2e;
  --border: #242a3a;
  --border-subtle: #1c2233;
  --text-primary: #d4dae8;
  --text-secondary: #5a6580;
  --text-tertiary: #3a4258;
  --accent: #a6ffdf;
  --accent-dim: rgba(166,255,223,0.06);
  --accent-glow: rgba(166,255,223,0.12);
  --status-running: #ffd07e;
  --status-error: #f85149;
  --status-waiting: #c4a1ff;
}

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  font-size: 13px;
  line-height: 1.5;
}

/* ── Sidebar ── */

.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border-subtle);
}

.sidebar-header h2 {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
}

.sidebar-count {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.wf-row {
  padding: 10px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}

.wf-row:hover {
  background: var(--accent-dim);
}

.wf-row.active {
  background: var(--bg-elevated);
  border-left-color: var(--accent);
}

.wf-row-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}

.wf-row-meta {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Status dots ── */

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.status-dot.success { background: var(--accent); }
.status-dot.pending, .status-dot.enqueued { background: var(--status-running); animation: pulse 2s ease-in-out infinite; }
.status-dot.error, .status-dot.retries_exceeded { background: var(--status-error); }
.status-dot.waiting { background: var(--status-waiting); animation: pulse 2s ease-in-out infinite; }
.status-dot.cancelled { background: var(--text-tertiary); }

/* ── Main panel ── */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── Connection indicator ── */

.connection {
  position: absolute;
  top: 12px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--text-tertiary);
  z-index: 10;
}

.connection .status-dot {
  width: 5px;
  height: 5px;
}

.connection.connected .status-dot { background: var(--accent); }
.connection.connected { color: var(--text-secondary); }
.connection.disconnected .status-dot { background: var(--text-tertiary); }

/* ── Empty state ── */

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  animation: fadeIn 0.3s ease;
}

.empty-state h2 {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
  color: var(--text-secondary);
}

.empty-state code {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ── Workflow detail ── */

.detail {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  animation: fadeIn 0.2s ease;
}

.detail::-webkit-scrollbar { width: 6px; }
.detail::-webkit-scrollbar-track { background: transparent; }
.detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.detail-header {
  margin-bottom: 24px;
}

.detail-header h1 {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 28px;
  color: var(--text-primary);
  line-height: 1.2;
}

.detail-header .wf-id {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

.detail-header .wf-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 12px;
  margin-top: 8px;
}

.wf-status-badge.success { background: var(--accent-dim); color: var(--accent); }
.wf-status-badge.pending, .wf-status-badge.enqueued { background: rgba(255,208,126,0.08); color: var(--status-running); }
.wf-status-badge.error, .wf-status-badge.retries_exceeded { background: rgba(248,81,73,0.08); color: var(--status-error); }
.wf-status-badge.cancelled { background: rgba(58,66,88,0.3); color: var(--text-secondary); }

.detail-header details {
  margin-top: 12px;
}

.detail-header details summary {
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
}

.detail-header details pre {
  margin-top: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 12px;
  font-size: 11px;
  color: var(--text-secondary);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ── Step flow (horizontal chain) ── */

.step-flow {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 16px 0 24px;
  overflow-x: auto;
  flex-wrap: nowrap;
}

.step-flow::-webkit-scrollbar { height: 3px; }
.step-flow::-webkit-scrollbar-track { background: transparent; }
.step-flow::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.step-chip {
  padding: 5px 12px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
  border: 1.5px solid transparent;
  transition: all 0.15s;
}

.step-chip.done {
  background: var(--accent);
  color: var(--bg-primary);
  border-color: var(--accent);
}

.step-chip.running {
  background: transparent;
  border-color: var(--status-running);
  color: var(--status-running);
  animation: pulse 2s ease-in-out infinite;
}

.step-chip.error {
  background: rgba(248,81,73,0.15);
  border-color: var(--status-error);
  color: var(--status-error);
}

.step-chip.waiting {
  background: transparent;
  border-color: var(--status-waiting);
  color: var(--status-waiting);
  animation: pulse 2s ease-in-out infinite;
}

.step-chip.after-error {
  background: transparent;
  border: 1.5px dashed var(--text-tertiary);
  color: var(--text-tertiary);
}

.step-chip .branch-indicator {
  margin-right: 4px;
  opacity: 0.7;
}

.step-arrow {
  color: var(--text-tertiary);
  margin: 0 4px;
  font-size: 12px;
  flex-shrink: 0;
}

.step-arrow.broken {
  color: var(--status-error);
}

/* ── Loop group ── */

.loop-group {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.loop-badge {
  font-size: 9px;
  color: var(--text-tertiary);
  letter-spacing: 0.04em;
  margin-right: 4px;
}

.loop-chip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.4;
  flex-shrink: 0;
}

.loop-chip.latest {
  opacity: 1;
  width: auto;
  height: auto;
  border-radius: 14px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 500;
  background: var(--accent);
  color: var(--bg-primary);
}

/* ── Step cards ── */

.step-cards {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.step-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  overflow: hidden;
  animation: fadeIn 0.15s ease;
}

.step-card.error-card {
  background: rgba(248,81,73,0.08);
  border-left: 3px solid var(--status-error);
}

.step-card.waiting-card {
  background: rgba(196,161,255,0.06);
  border-left: 3px solid var(--status-waiting);
}

.step-card-header {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}

.step-card-header:hover {
  background: var(--accent-dim);
}

.step-card-name {
  font-weight: 500;
  font-size: 12px;
  flex: 1;
}

.step-card-fn {
  font-size: 10px;
  color: var(--text-tertiary);
}

.step-card-duration {
  font-size: 10px;
  color: var(--text-secondary);
  background: var(--bg-elevated);
  padding: 2px 8px;
  border-radius: 10px;
}

.step-card-status {
  font-size: 12px;
  flex-shrink: 0;
}

.waiting-badge {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--status-waiting);
  background: rgba(196,161,255,0.12);
  padding: 2px 8px;
  border-radius: 10px;
}

.step-card-body {
  display: none;
  padding: 0 14px 12px;
}

.step-card.expanded .step-card-body {
  display: block;
}

.step-card-body pre {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 11px;
  color: var(--text-secondary);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 300px;
  overflow-y: auto;
}

.step-card.error-card .error-msg {
  color: var(--status-error);
  font-size: 12px;
  margin-bottom: 8px;
  padding: 0 14px;
}

/* ── Approve / Reject buttons ── */

.approval-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px 12px;
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn:hover { opacity: 0.85; }
.btn:active { opacity: 0.7; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-approve {
  background: var(--accent);
  color: var(--bg-primary);
}

.btn-reject {
  background: var(--status-error);
  color: #fff;
}

.approval-cli {
  font-size: 10px;
  color: var(--text-tertiary);
  padding: 0 14px 10px;
}

.approval-cli code {
  background: var(--bg-elevated);
  padding: 2px 6px;
  border-radius: 3px;
}

/* ── Animations ── */

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Workflows</h2>
    <div class="sidebar-count" id="sidebar-count">0 workflows</div>
  </div>
  <div class="sidebar-list" id="sidebar-list"></div>
</div>

<div class="main">
  <div class="connection disconnected" id="connection">
    <span class="status-dot"></span>
    <span class="connection-text">disconnected</span>
  </div>
  <div id="main-content"></div>
</div>

<script>
// ── State ──

const state = {
  workflows: [],
  selectedId: null,
  selectedSteps: [],
  selectedWorkflow: null,
  connected: false,
  pollTimer: null,
  backoffMs: 2000,
  expandedSteps: new Set(),
};

// ── API ──

async function fetchWorkflows() {
  try {
    const res = await fetch('/api/workflows');
    if (!res.ok) throw new Error(res.statusText);
    state.workflows = await res.json();
    state.connected = true;
    state.backoffMs = 2000;
    updateConnectionIndicator();
    renderSidebar(state.workflows);

    if (!state.selectedId && state.workflows.length > 0) {
      selectWorkflow(state.workflows[0].workflowID);
    } else if (state.selectedId) {
      await fetchSteps(state.selectedId);
    }
  } catch (e) {
    state.connected = false;
    updateConnectionIndicator();
    state.backoffMs = Math.min(state.backoffMs * 1.5, 30000);
  }
}

async function fetchSteps(id) {
  try {
    const res = await fetch(`/api/workflows/${encodeURIComponent(id)}/steps`);
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    state.selectedWorkflow = data.workflow;
    state.selectedSteps = data.steps || [];
    renderDetail(state.selectedWorkflow, state.selectedSteps);
  } catch (e) {
    // silent
  }
}

async function sendMessage(id, topic, message) {
  try {
    const res = await fetch(`/api/workflows/${encodeURIComponent(id)}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, message }),
    });
    if (!res.ok) throw new Error(res.statusText);
    await fetchSteps(id);
  } catch (e) {
    console.error('sendMessage failed:', e);
  }
}

// ── Selection ──

function selectWorkflow(id) {
  state.selectedId = id;
  state.expandedSteps.clear();
  renderSidebar(state.workflows);
  fetchSteps(id);
}

// ── Rendering ──

function updateConnectionIndicator() {
  const el = document.getElementById('connection');
  el.className = `connection ${state.connected ? 'connected' : 'disconnected'}`;
  el.querySelector('.connection-text').textContent = state.connected ? 'connected' : 'disconnected';
}

function renderSidebar(workflows) {
  const container = document.getElementById('sidebar-list');
  const count = document.getElementById('sidebar-count');
  count.textContent = `${workflows.length} workflow${workflows.length !== 1 ? 's' : ''}`;

  container.innerHTML = workflows.map(wf => {
    const active = wf.workflowID === state.selectedId ? ' active' : '';
    const statusClass = statusToClass(wf.status);
    const shortId = (wf.workflowID || '').slice(0, 8);
    const name = wf.workflowName || wf.workflowClassName || shortId;
    const age = formatAge(wf.updatedAt || wf.createdAt);
    const steps = wf.stepCount != null ? `${wf.stepCount} steps` : '';

    return `<div class="wf-row${active}" onclick="selectWorkflow('${escHtml(wf.workflowID)}')">
      <div class="wf-row-name"><span class="status-dot ${statusClass}"></span>${escHtml(name)}</div>
      <div class="wf-row-meta"><span>${escHtml(shortId)}</span><span>${escHtml(steps)}</span><span>${escHtml(age)}</span></div>
    </div>`;
  }).join('');
}

function renderDetail(workflow, steps) {
  const container = document.getElementById('main-content');

  if (!workflow) {
    container.innerHTML = renderEmptyState();
    return;
  }

  const statusClass = statusToClass(workflow.status);
  const name = workflow.workflowName || workflow.workflowClassName || workflow.workflowID;
  const inputHtml = workflow.input
    ? `<details><summary>input arguments</summary><pre><code>${escHtml(jsonPretty(workflow.input))}</code></pre></details>`
    : '';

  const loops = detectLoops(steps);
  const flowHtml = renderStepFlow(steps, loops);
  const cardsHtml = renderStepCards(steps, loops, workflow.workflowID);

  container.innerHTML = `<div class="detail">
    <div class="detail-header">
      <h1>${escHtml(name)}</h1>
      <div class="wf-id">${escHtml(workflow.workflowID)}</div>
      <div class="wf-status-badge ${statusClass}"><span class="status-dot ${statusClass}"></span>${escHtml(workflow.status)}</div>
      ${inputHtml}
    </div>
    ${flowHtml}
    <div class="step-cards">${cardsHtml}</div>
  </div>`;
}

function renderEmptyState() {
  return `<div class="empty-state">
    <h2>No workflows yet</h2>
    <code>npx tsx templates/basic-workflow.ts</code>
  </div>`;
}

function renderStepFlow(steps, loops) {
  if (!steps || steps.length === 0) return '';

  let seenError = false;
  const fragments = [];
  const loopedNames = new Set(Object.keys(loops));
  const renderedLoops = new Set();

  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    const stepName = step.stepName || step.functionName || `step-${i}`;

    // If part of a loop group, render the group once
    if (loopedNames.has(stepName)) {
      if (renderedLoops.has(stepName)) continue;
      renderedLoops.add(stepName);

      const group = loops[stepName];
      const latest = group[group.length - 1];
      const latestClass = stepChipClass(latest, seenError);

      if (fragments.length > 0) {
        fragments.push(`<span class="step-arrow${seenError ? ' broken' : ''}">&rarr;</span>`);
      }

      const chips = group.slice(0, -1).map(() => `<span class="loop-chip"></span>`).join('');
      fragments.push(`<div class="loop-group">
        <span class="loop-badge">loop &middot; iter ${group.length}</span>
        ${chips}
        <span class="step-chip ${latestClass} loop-chip latest">${escHtml(stepName)}</span>
      </div>`);

      if (latest.stepStatus === 'ERROR') seenError = true;
      continue;
    }

    if (fragments.length > 0) {
      fragments.push(`<span class="step-arrow${seenError ? ' broken' : ''}">&rarr;</span>`);
    }

    const chipClass = stepChipClass(step, seenError);
    const branch = step.childWorkflowID ? '<span class="branch-indicator">&curarr;</span>' : '';
    fragments.push(`<span class="step-chip ${chipClass}">${branch}${escHtml(stepName)}</span>`);

    if (step.stepStatus === 'ERROR') seenError = true;
  }

  return `<div class="step-flow">${fragments.join('')}</div>`;
}

function stepChipClass(step, seenError) {
  if (seenError && step.stepStatus !== 'ERROR') return 'after-error';
  const s = (step.stepStatus || '').toUpperCase();
  if (s === 'SUCCESS') return 'done';
  if (s === 'ERROR') return 'error';
  if (s === 'PENDING' && step.output == null) return 'waiting';
  if (s === 'PENDING' || s === 'ENQUEUED') return 'running';
  return 'done';
}

function renderStepCards(steps, loops, workflowId) {
  if (!steps || steps.length === 0) return '<div class="empty-state"><h2>No steps recorded</h2></div>';

  const loopedNames = new Set(Object.keys(loops));
  const renderedLoops = new Set();
  const cards = [];

  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    const stepName = step.stepName || step.functionName || `step-${i}`;

    // For looped steps, render only the latest expanded + note about previous iterations
    if (loopedNames.has(stepName)) {
      if (renderedLoops.has(stepName)) continue;
      renderedLoops.add(stepName);
      const group = loops[stepName];
      const latest = group[group.length - 1];
      cards.push(renderSingleCard(latest, i, workflowId, `loop iter ${group.length}/${group.length}`));
      continue;
    }

    cards.push(renderSingleCard(step, i, workflowId));
  }

  return cards.join('');
}

function renderSingleCard(step, index, workflowId, loopNote) {
  const stepName = step.stepName || step.functionName || `step-${index}`;
  const fnId = step.functionID != null ? `#${step.functionID}` : '';
  const isError = (step.stepStatus || '').toUpperCase() === 'ERROR';
  const isWaiting = (step.stepStatus || '').toUpperCase() === 'PENDING' && step.output == null;
  const expanded = isError || isWaiting || state.expandedSteps.has(index);

  let cardClass = 'step-card';
  if (isError) cardClass += ' error-card expanded';
  else if (isWaiting) cardClass += ' waiting-card expanded';
  else if (expanded) cardClass += ' expanded';

  const statusIcon = stepStatusIcon(step.stepStatus);
  const duration = step.executionTime != null ? formatDuration(step.executionTime) : '';

  let errorMsg = '';
  if (isError && step.error) {
    errorMsg = `<div class="error-msg">${escHtml(String(step.error))}</div>`;
  }

  let waitingBadge = '';
  if (isWaiting) {
    waitingBadge = '<span class="waiting-badge">WAITING FOR INPUT</span>';
  }

  let approvalHtml = '';
  if (isWaiting) {
    approvalHtml = `<div class="approval-actions">
      <button class="btn btn-approve" onclick="event.stopPropagation(); approve('${escHtml(workflowId)}')">Approve</button>
      <button class="btn btn-reject" onclick="event.stopPropagation(); reject('${escHtml(workflowId)}')">Reject</button>
    </div>
    <div class="approval-cli">CLI: <code>curl -X POST /api/workflows/${escHtml(workflowId)}/send -d '{"topic":"approval","message":{"approved":true}}'</code></div>`;
  }

  const loopHtml = loopNote ? `<span class="step-card-duration">${escHtml(loopNote)}</span>` : '';
  const durationHtml = duration ? `<span class="step-card-duration">${escHtml(duration)}</span>` : '';

  const outputJson = step.output != null ? jsonPretty(step.output) : 'null';

  return `<div class="${cardClass}" data-index="${index}">
    <div class="step-card-header" onclick="toggleCard(${index})">
      <span class="step-card-status">${statusIcon}</span>
      <span class="step-card-name">${escHtml(stepName)}</span>
      ${waitingBadge}
      <span class="step-card-fn">${escHtml(fnId)}</span>
      ${loopHtml}
      ${durationHtml}
    </div>
    ${errorMsg}
    ${approvalHtml}
    <div class="step-card-body">
      <pre><code>${escHtml(outputJson)}</code></pre>
    </div>
  </div>`;
}

function toggleCard(index) {
  if (state.expandedSteps.has(index)) {
    state.expandedSteps.delete(index);
  } else {
    state.expandedSteps.add(index);
  }
  const card = document.querySelector(`.step-card[data-index="${index}"]`);
  if (card && !card.classList.contains('error-card') && !card.classList.contains('waiting-card')) {
    card.classList.toggle('expanded');
  }
}

// ── Approve / Reject ──

function approve(workflowId) {
  sendMessage(workflowId, 'approval', { approved: true });
}

function reject(workflowId) {
  sendMessage(workflowId, 'approval', { approved: false });
}

// ── Loop detection ──

function detectLoops(steps) {
  if (!steps) return {};
  const counts = {};
  for (const step of steps) {
    const name = step.stepName || step.functionName;
    if (!name) continue;
    if (!counts[name]) counts[name] = [];
    counts[name].push(step);
  }
  const loops = {};
  for (const [name, group] of Object.entries(counts)) {
    if (group.length >= 3) {
      loops[name] = group;
    }
  }
  return loops;
}

// ── Polling ──

function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(fetchWorkflows, state.backoffMs);
}

// ── Helpers ──

function statusToClass(status) {
  const s = (status || '').toUpperCase();
  if (s === 'SUCCESS') return 'success';
  if (s === 'PENDING' || s === 'ENQUEUED') return 'pending';
  if (s === 'ERROR') return 'error';
  if (s === 'RETRIES_EXCEEDED') return 'retries_exceeded';
  if (s === 'CANCELLED') return 'cancelled';
  return 'pending';
}

function stepStatusIcon(status) {
  const s = (status || '').toUpperCase();
  if (s === 'SUCCESS') return '<span style="color:var(--accent)">&#10003;</span>';
  if (s === 'ERROR') return '<span style="color:var(--status-error)">&#10007;</span>';
  if (s === 'PENDING') return '<span style="color:var(--status-running)">&#9679;</span>';
  return '<span style="color:var(--text-tertiary)">&#9675;</span>';
}

function formatAge(ts) {
  if (!ts) return '';
  const ms = typeof ts === 'number' ? ts : new Date(ts).getTime();
  const diff = Date.now() - ms;
  if (diff < 5000) return 'just now';
  if (diff < 60000) return `${Math.floor(diff / 1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff / 60000)} min ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return `${Math.floor(diff / 86400000)}d ago`;
}

function formatDuration(ms) {
  if (ms < 1000) return `${ms}ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
  return `${(ms / 60000).toFixed(1)}m`;
}

function jsonPretty(val) {
  try {
    if (typeof val === 'string') {
      return JSON.stringify(JSON.parse(val), null, 2);
    }
    return JSON.stringify(val, null, 2);
  } catch {
    return String(val);
  }
}

function escHtml(str) {
  const el = document.createElement('span');
  el.textContent = str;
  return el.innerHTML;
}

// ── Init ──

fetchWorkflows();
startPolling();

// Re-adjust poll interval on backoff changes
setInterval(() => {
  if (state.pollTimer) {
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(fetchWorkflows, state.backoffMs);
  }
}, 10000);
</script>
